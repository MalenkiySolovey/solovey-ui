name: Build Solovey UI for Windows

on:
  workflow_call:
    inputs:
      source_commit:
        description: Immutable product commit resolved by the canonical release owner
        required: true
        type: string
      tag:
        required: true
        type: string
      preflight_only:
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2026.3.1"
        type: string
      preflight_only:
        description: "Build Windows release package without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "25"
  RELEASE_TAG_INPUT: ${{ inputs.tag || github.ref_name }}
  TAGS: "with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_tailscale"
  LIBCRONET_BASE_URL: "https://github.com/SagerNet/cronet-go/releases/download/v148.0.7778.96-1"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          fetch-depth: 1

      - name: Validate release tag against source version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG_INPUT#v}"
          EXPECTED_VERSION="$(tr -d '\r\n' < config/identity/version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [ "$VERSION" = "$EXPECTED_VERSION" ] || { echo "release tag $RELEASE_TAG_INPUT does not match source version $EXPECTED_VERSION" >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          SOLOVEY_UI_PROFILE=full npm run build

      - name: Check full frontend profile
        run: node scripts/check-frontend-profile.mjs --profile full --dist frontend/dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-windows:
    needs: build-frontend
    name: Build-windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-latest, cgo: "1" }
          - { arch: arm64, runner: windows-11-arm, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}

      - name: Validate Windows scripts and service contract
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = @()
          Get-ChildItem windows -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $parseErrors += $fileErrors
          }
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List
            exit 1
          }
          [xml](Get-Content windows/s-ui-windows.xml -Raw) | Out-Null

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: web/html

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up native ARM64 C toolchain
        id: msys2
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit

      - name: Build Solovey UI
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -euo pipefail
          [ -n "$SUI_RELEASE_TRUST_ROOTS_B64" ] || { echo "release trust roots are required" >&2; exit 1; }
          export CGO_ENABLED=${{ matrix.cgo }}
          export GOOS=windows
          export GOARCH=${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
            export CC=clang
          else
            export CC=gcc
          fi

          echo "Building for Windows ${{ matrix.arch }}"
          go version
          go env GOOS GOARCH GOHOSTARCH CC
          "$CC" --version

          # Exercise the real SQLite runtime on the native target before
          # packaging so a CGO-disabled stub can never become a release asset.
          go test ./database/sqlite

          node scripts/generate-component-imports.mjs --profile full --out app/components_generated.go
          go build -trimpath -buildvcs=false -ldflags="-buildid= -w -s -checklinkname=0 -X github.com/MalenkiySolovey/solovey-ui/config/update.ReleaseTrustRootsBase64=$SUI_RELEASE_TRUST_ROOTS_B64" -tags "${{ env.TAGS }}" -o sui.exe main.go
          file sui.exe

          mkdir solovey-ui-windows
          cp sui.exe solovey-ui-windows/
          cp -r windows/* solovey-ui-windows/
          {
            echo "version=$RELEASE_TAG_INPUT"
            echo "commit=$(git rev-parse HEAD)"
            echo "source_fingerprint=$(node scripts/release-source.mjs .)"
            echo "platform=windows/${{ matrix.arch }}"
            echo "profile=full"
          } > solovey-ui-windows/BUILD_INFO.txt

      - name: Download libcronet-go
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64) CRONET_SHA256="c7434cfa93c3041321dd19111c4de6c52b8a9531a65661ba45425d3c51ec69e2" ;;
            arm64) CRONET_SHA256="fc9e3bae0b326d83092a5de2c04d8b4139dc5c1ba576a035dee4bde780a3c95f" ;;
            *) echo "no pinned libcronet sha256 for arch ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --connect-timeout 20 --retry 3 --retry-all-errors \
            -o solovey-ui-windows/libcronet.dll \
            ${{ env.LIBCRONET_BASE_URL }}/libcronet-windows-${{ matrix.arch }}.dll
          echo "${CRONET_SHA256}  solovey-ui-windows/libcronet.dll" | sha256sum -c -

      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive `
            -Path solovey-ui-windows `
            -DestinationPath "solovey-ui-windows-${{ matrix.arch }}.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Package on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          zip -r "solovey-ui-windows-${{ matrix.arch }}.zip" solovey-ui-windows

      - name: Write package checksum
        shell: bash
        run: sha256sum "solovey-ui-windows-${{ matrix.arch }}.zip" > "solovey-ui-windows-${{ matrix.arch }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solovey-ui-windows-${{ matrix.arch }}
          path: |
            ./solovey-ui-windows-${{ matrix.arch }}.zip
            ./solovey-ui-windows-${{ matrix.arch }}.zip.sha256
          retention-days: 1
