name: Build Solovey UI for Windows

on:
  workflow_call:
    inputs:
      source_commit:
        description: Immutable product commit resolved by the canonical release owner
        required: true
        type: string
      tag:
        required: true
        type: string
      preflight_only:
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact immutable product SHA for a tagless non-publishing qualification"
        required: false
        default: ""
        type: string
      tag:
        description: "Release tag"
        required: true
        default: "v2026.5.1"
        type: string
      preflight_only:
        description: "Build Windows release package without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG_INPUT: ${{ inputs.tag || github.ref_name }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}
          submodules: recursive
          fetch-depth: 1

      - name: Validate release tag against source version
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SOURCE_COMMIT" ]; then
            [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_COMMIT" ] || { echo 'exact product source SHA is required' >&2; exit 1; }
            [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$PREFLIGHT_ONLY" = true ] || { echo 'tagless manual qualification must not publish' >&2; exit 1; }
          fi
          VERSION="${RELEASE_TAG_INPUT#v}"
          EXPECTED_VERSION="$(tr -d '\r\n' < config/identity/version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [ "$VERSION" = "$EXPECTED_VERSION" ] || { echo "release tag $RELEASE_TAG_INPUT does not match source version $EXPECTED_VERSION" >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          SOLOVEY_UI_PROFILE=full npm run build
          cp -a dist ../.release-frontend-full
          SOLOVEY_UI_PROFILE=core npm run build
          cp -a dist ../.release-frontend-core

      - name: Check full frontend profile
        run: |
          node scripts/check-frontend-profile.mjs --profile full --dist .release-frontend-full
          node scripts/check-frontend-profile.mjs --profile core --dist .release-frontend-core

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: .release-frontend-full
          include-hidden-files: true
          retention-days: 1

      - name: Upload core frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-core-dist
          path: .release-frontend-core
          include-hidden-files: true
          retention-days: 7

  build-windows:
    needs: build-frontend
    name: Build-windows-${{ matrix.arch }}-${{ matrix.profile }}-${{ matrix.provider }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [full, core]
        provider: [sing-box, shtorm-extended]
        include:
          - { arch: amd64, runner: windows-latest, cgo: "1" }
          - { arch: arm64, runner: windows-11-arm, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}

      - name: Validate Windows scripts and service contract
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = @()
          Get-ChildItem windows -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $parseErrors += $fileErrors
          }
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List
            exit 1
          }
          [xml](Get-Content windows/s-ui-windows.xml -Raw) | Out-Null

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.profile == 'core' && 'frontend-core-dist' || 'frontend-dist' }}
          path: .release/frontend

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version

      - name: Resolve immutable Windows source identity
        id: source_identity
        shell: bash
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain)" ] || { echo "Windows source must be clean before profile generation" >&2; exit 1; }
          echo "fingerprint=$(node scripts/release-source.mjs .)" >> "$GITHUB_OUTPUT"

      - name: Set up native ARM64 C toolchain
        id: msys2
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit

      - name: Build Solovey UI
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -euo pipefail
          [ -n "$SUI_RELEASE_TRUST_ROOTS_B64" ] || { echo "release trust roots are required" >&2; exit 1; }
          export CGO_ENABLED=${{ matrix.cgo }}
          export GOOS=windows
          export GOARCH=${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
            export CC=clang
          else
            export CC=gcc
          fi

          echo "Building for Windows ${{ matrix.arch }}"
          go version
          go env GOOS GOARCH GOHOSTARCH CC
          "$CC" --version

          # Exercise the real SQLite runtime on the native target before
          # packaging so a CGO-disabled stub can never become a release asset.
          go test ./database/sqlite

          printf '%s' "$SUI_RELEASE_TRUST_ROOTS_B64" > .release/public-roots.b64
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File windows/build-windows.ps1 \
            -Architecture '${{ matrix.arch }}' -Profile '${{ matrix.profile }}' -Provider '${{ matrix.provider }}' \
            -FrontendDist .release/frontend -TrustRootsFile .release/public-roots.b64 \
            -ExpectedSourceFingerprint '${{ steps.source_identity.outputs.fingerprint }}' -PackageDirectory solovey-ui-windows

      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive `
            -Path solovey-ui-windows `
            -DestinationPath "solovey-ui${{ matrix.provider == 'shtorm-extended' && '-shtorm-extended' || '' }}${{ matrix.profile == 'core' && '-core' || '' }}-windows-${{ matrix.arch }}.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Package on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          zip -r "solovey-ui${{ matrix.provider == 'shtorm-extended' && '-shtorm-extended' || '' }}${{ matrix.profile == 'core' && '-core' || '' }}-windows-${{ matrix.arch }}.zip" solovey-ui-windows

      - name: Write package checksum
        shell: bash
        env:
          ARCHIVE: solovey-ui${{ matrix.provider == 'shtorm-extended' && '-shtorm-extended' || '' }}${{ matrix.profile == 'core' && '-core' || '' }}-windows-${{ matrix.arch }}.zip
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const name = process.env.ARCHIVE;
          const hash = crypto.createHash('sha256');
          for await (const chunk of fs.createReadStream(name)) hash.update(chunk);
          fs.writeFileSync(`${name}.sha256`, `${hash.digest('hex')}  ${name}\n`);
          NODE

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solovey-ui${{ matrix.provider == 'shtorm-extended' && '-shtorm-extended' || '' }}${{ matrix.profile == 'core' && '-core' || '' }}-windows-${{ matrix.arch }}
          path: |
            ./solovey-ui${{ matrix.provider == 'shtorm-extended' && '-shtorm-extended' || '' }}${{ matrix.profile == 'core' && '-core' || '' }}-windows-${{ matrix.arch }}.zip
            ./solovey-ui${{ matrix.provider == 'shtorm-extended' && '-shtorm-extended' || '' }}${{ matrix.profile == 'core' && '-core' || '' }}-windows-${{ matrix.arch }}.zip.sha256
          retention-days: 7

      - name: Qualify the installed Extended artifact on its native architecture
        if: matrix.provider == 'shtorm-extended'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $peer = Join-Path $env:RUNNER_TEMP 'qualification-mieru-peer.exe'
          go build '-mod=readonly' '-modfile=go.extended.mod' -o $peer ./testdata/platform-qualification/mieru-peer.go
          if ($LASTEXITCODE -ne 0) { throw 'Pinned qualification peer build failed' }
          $installed = Join-Path $env:RUNNER_TEMP 'native-installed-panel'
          New-Item -ItemType Directory -Path $installed | Out-Null
          Copy-Item -LiteralPath 'solovey-ui-windows/sui.exe' -Destination (Join-Path $installed 'sui.exe')
          & windows/prepare-windows-install.ps1 -InstallDir $installed -PackageRoot (Join-Path $PWD 'solovey-ui-windows')
          $configuration = Join-Path $env:RUNNER_TEMP 'qualification.json'
          @{
            outputRoot = (Join-Path $installed 'logs/qualification')
            name = 'windows-${{ matrix.arch }}-${{ matrix.profile }}'
            mode = 'native-hosted-windows'
            port = 28812
            extended = (Join-Path $installed 'sui.exe')
            peer = $peer
            sourceCommit = (git rev-parse HEAD)
            panelSha256 = (Get-FileHash -LiteralPath (Join-Path $installed 'sui.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            expectedNativeSha = (Get-FileHash -LiteralPath (Join-Path $installed 'libcronet.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
            env = @{ SUI_DB_FOLDER = (Join-Path $installed 'db') }
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $configuration -Encoding UTF8
          node testdata/platform-qualification/runtime-campaign.mjs $configuration
          if ($LASTEXITCODE -ne 0) { throw 'Native installed artifact qualification failed' }

      - name: Retain sanitized native runtime observations
        if: always() && matrix.provider == 'shtorm-extended'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-runtime-windows-${{ matrix.arch }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/native-installed-panel/logs/qualification/windows-${{ matrix.arch }}-${{ matrix.profile }}/result.json
          if-no-files-found: error
          retention-days: 7

  verify-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable product verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}
      - name: Download Windows candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: solovey-ui*windows-*
          path: windows-assets
          merge-multiple: true
      - name: Set up verifier Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Set up verifier Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Verify complete Windows candidates before publication eligibility
        run: node scripts/release-verify.mjs windows-assets "$RELEASE_TAG_INPUT" --windows
