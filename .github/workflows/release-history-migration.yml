name: One-time 2026.3.2 release history migration

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Restore the stable baseline and retire the misclassified original after beta.1 verification
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: solovey-release-publication
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '25'
      - name: Verify or execute the bounded migration
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_EXECUTE: ${{ inputs.execute }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
          SUI_RELEASE_SIGNING_KEY_ID: ${{ vars.SUI_RELEASE_SIGNING_KEY_ID }}
          SUI_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SUI_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
        run: node scripts/release-history-migration.mjs
      - name: Preserve migration receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-history-migration-receipt
          path: .migration/receipt.json
          if-no-files-found: warn
          retention-days: 90
