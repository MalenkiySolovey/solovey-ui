name: Release Solovey UI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2026.3.1"
        type: string
      preflight_only:
        description: "Validate and build release artifacts without publishing"
        required: true
        default: true
        type: boolean
      resume_run_id:
        description: "Completed canonical run whose verified artifacts finish an interrupted publication"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  packages: write

# A release and its mutable channel pointer have one writer at a time.
concurrency:
  group: solovey-release-publication
  cancel-in-progress: false

env:
  NODE_VERSION: "25"
  RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CRONET_GO_VERSION: "v148.0.7778.96-1"
  CRONET_GO_COMMIT: "e7f6f6f5b7ce226f686f6cb5d068a63da6657ccd"
  CRONET_GO_REPO: https://github.com/sagernet/cronet-go.git
  BOOTLIN_BASE_URL: https://toolchains.bootlin.com/downloads/releases/toolchains

jobs:
  build-docker:
    if: inputs.resume_run_id == ''
    needs: [release-preflight, assemble-linux, build-windows]
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      preflight_only: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only }}
      source_commit: ${{ needs.release-preflight.outputs.product-commit }}
    secrets: inherit

  build-windows:
    if: inputs.resume_run_id == ''
    needs: release-preflight
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      preflight_only: true
      source_commit: ${{ needs.release-preflight.outputs.product-commit }}
    secrets: inherit

  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      linux-matrix: ${{ steps.targets.outputs.linux-matrix }}
      product-commit: ${{ steps.product.outputs.commit }}
      source-fingerprint: ${{ steps.product.outputs.fingerprint }}
    steps:
      - name: Check out release orchestrator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workflow validator dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate static release contracts
        run: |
          node --check scripts/release-preflight.mjs
          node --check scripts/release-preflight.test.mjs
          node --test scripts/release-preflight.test.mjs
          node scripts/audit/validate-workflows.js
          node --test scripts/release-execution.test.mjs

      - name: Check out immutable product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG_INPUT }}

      - name: Resolve immutable product identity
        id: product
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          FINGERPRINT="$(node scripts/release-source.mjs .)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          printf 'Product commit: %s\nSource fingerprint: %s\nOrchestrator commit: %s\n' "$COMMIT" "$FINGERPRINT" "$GITHUB_SHA"

      - name: Validate configured release authority
        env:
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
          SUI_RELEASE_SIGNING_KEY_ID: ${{ vars.SUI_RELEASE_SIGNING_KEY_ID }}
          SUI_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SUI_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          RELEASE_SEQUENCE="$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))"
          node scripts/release-preflight.mjs --tag "$RELEASE_TAG_INPUT" --sequence "$RELEASE_SEQUENCE"

      - name: Read canonical Linux targets
        id: targets
        run: node -e 'const fs=require("fs"); const targets=require("./scripts/release-targets.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "linux-matrix="+JSON.stringify({include:targets.linux})+"\n")'

      - name: Verify immutable publication identity before any registry write
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT: ${{ steps.product.outputs.commit }}
        run: env GITHUB_SHA="$PRODUCT_COMMIT" node scripts/release-publish-gate.mjs before "$RELEASE_TAG_INPUT"

  test-installer:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release tag against source version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG_INPUT#v}"
          EXPECTED_VERSION="$(tr -d '\r\n' < config/identity/version)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [ "$VERSION" = "$EXPECTED_VERSION" ] || { echo "release tag $RELEASE_TAG_INPUT does not match source version $EXPECTED_VERSION" >&2; exit 1; }

      - name: Shell syntax
        run: bash -n install.sh solovey-ui.sh scripts/release-package-linux.sh scripts/release-package-components.sh scripts/server-smoke-debian.sh tests/installer/backup.sh tests/installer/doctor.sh tests/installer/install-update.sh tests/installer/migrate-from-sui.sh tests/installer/rollback.sh tests/installer/release-manifest.sh tests/installer/release-package.sh tests/installer/manager-cookie-key.sh tests/installer/systemd-contracts.sh

      - name: Validate deployment contracts
        env:
          SOLOVEY_UI_IMAGE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SOLOVEY_UI_PANEL_PORT: "2095"
          SOLOVEY_UI_PUBLIC_TCP_PORT: "443"
          SOLOVEY_UI_PUBLIC_UDP_PORT: "443"
        run: |
          bash tests/installer/systemd-contracts.sh
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.bridge.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.network-advanced.yml config >/dev/null

      - name: release package integration
        run: bash tests/installer/release-package.sh

      - name: Semantic release resolution and complete release verification
        run: |
          bash tests/installer/latest-release.sh
          node --test scripts/release-verify.test.mjs scripts/release-target.test.mjs scripts/release-publish-gate.test.mjs scripts/release-source.test.mjs

      - name: signed release manifest integration
        run: bash tests/installer/release-manifest.sh

      - name: install/update integration
        run: bash tests/installer/install-update.sh

      - name: migrate-from-sui integration
        run: bash tests/installer/migrate-from-sui.sh

      - name: rollback integration
        run: bash tests/installer/rollback.sh

      - name: cookie key rotation integration
        run: bash tests/installer/manager-cookie-key.sh

      - name: backup integration
        run: bash tests/installer/backup.sh

      - name: doctor integration
        run: bash tests/installer/doctor.sh

  build-frontend:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Strict, fail-closed install: a desynced package-lock.json aborts the
      # release here instead of silently shipping an unvalidated bundle.
      # `npm install` (lenient) previously masked a lockfile desync and shipped
      # an inconsistent dist with a dangling chunk -> 404 -> black screen
      # (v1.5.7-beta6). Mirror the same gates CI runs so a release can never
      # carry a frontend that CI would reject.
      - name: Install frontend dependencies (strict)
        working-directory: frontend
        run: npm ci

      - name: Frontend utility script syntax
        run: |
          node --check scripts/audit/validate-workflows.js
          node --check scripts/component-frontend-manifest.mjs
          node --check scripts/check-frontend-profile.mjs
          node --check scripts/extract-component-frontend.mjs
          node --check scripts/generate-component-imports.mjs
          node --check scripts/release-manifest.mjs
          node --check scripts/write-component-installed-metadata.mjs

      - name: Validate workflow contracts
        run: node scripts/audit/validate-workflows.js

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build full frontend
        working-directory: frontend
        run: SOLOVEY_UI_PROFILE=full npm run build

      - name: Check full frontend profile
        run: node scripts/check-frontend-profile.mjs --profile full --dist frontend/dist

      - name: Extract optional component frontend packs
        run: node scripts/extract-component-frontend.mjs --dist frontend/dist --components-dir components --out-dir .release/components --prune-dist

      - name: Upload full frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist-full
          path: frontend/dist/
          retention-days: 1

      - name: Upload component frontend packs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: component-frontend-packs
          path: .release/components/
          retention-days: 1

      - name: Build core frontend
        working-directory: frontend
        run: SOLOVEY_UI_PROFILE=core npm run build

      - name: Check core frontend profile
        run: node scripts/check-frontend-profile.mjs --profile core --dist frontend/dist

      - name: Upload core frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist-core
          path: frontend/dist/
          retention-days: 1

  component-profile-checks:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full --out app/components_generated.go

      - name: Component profile tests
        run: |
          set -euo pipefail
          PRIVILEGED_PACKAGE="$(go list ./components/server-protection/cmd/solovey-openwrt-owner-manifest)"
          go list ./internal/components/... ./components/... ./api ./app ./web > "$RUNNER_TEMP/component-packages.txt"
          mapfile -t PACKAGES < "$RUNNER_TEMP/component-packages.txt"
          ORDINARY_PACKAGES=()
          for package in "${PACKAGES[@]}"; do
            [ "$package" = "$PRIVILEGED_PACKAGE" ] || ORDINARY_PACKAGES+=("$package")
          done
          go test -p 1 -count=1 "${ORDINARY_PACKAGES[@]}"
          go test -p 1 -tags minimal -count=1 ./internal/components/... ./api ./app ./web

      # Compile as the runner user; only this namespace/chroot integration
      # package executes with privilege. All its tests and assertions run.
      - name: Privileged OpenWrt composition package
        run: |
          set -euo pipefail
          test "$(go env CGO_ENABLED)" = 1
          go test -c -o "$RUNNER_TEMP/openwrt-composition.test" ./components/server-protection/cmd/solovey-openwrt-owner-manifest
          sudo -n "$RUNNER_TEMP/openwrt-composition.test" -test.v -test.count=1 2>&1 | tee "$RUNNER_TEMP/openwrt-composition.log"
          grep -q '^--- PASS: TestOpenWrtWriterFeedsInstalledLoaderAndBrokerHelperComposition ' "$RUNNER_TEMP/openwrt-composition.log"
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/openwrt-composition.log"

      - name: Minimal dependency boundary
        run: |
          set -euo pipefail
          if go list -tags minimal -deps ./app | grep -E 'github.com/MalenkiySolovey/solovey-ui/(components|api/remotesub|paidsub|api/telegram|service/remote_outbound|internal/subscriptions/remote|cronjob/jobs/notifications)'; then
            echo "minimal app depends on optional backend packages" >&2
            exit 1
          fi

      - name: Core profile build
        run: go build -tags minimal -o /tmp/solovey-ui-core main.go

  build-linux:
    if: inputs.resume_run_id == ''
    name: Build-${{ matrix.platform }}
    needs:
      - release-preflight
      - build-frontend
      - component-profile-checks
      - test-installer
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-preflight.outputs.linux-matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}

      - name: Download full frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist-full
          path: .release/frontend-full

      - name: Download core frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist-core
          path: .release/frontend-core

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Clone cronet-go (naive platforms)
        if: matrix.naive && matrix.compiler != 'bootlin'
        run: |
          set -e
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin ${{ env.CRONET_GO_REPO }}
          git -C ~/cronet-go fetch --depth=1 origin "${{ env.CRONET_GO_VERSION }}"
          git -C ~/cronet-go checkout FETCH_HEAD
          test "$(git -C ~/cronet-go rev-parse HEAD)" = "${{ env.CRONET_GO_COMMIT }}"
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring (cronet sysroot)
        if: matrix.naive && matrix.compiler != 'bootlin'
        run: |
          set -e
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Build cronet library and set toolchain environment
        if: matrix.naive && matrix.compiler != 'bootlin'
        run: |
          set -e
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            [[ -z "$line" ]] && continue
            echo "$line" >> $GITHUB_ENV
          done

      - name: Set Go build environment
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          if [ -n "${{ matrix.goarm }}" ]; then echo "GOARM=${{ matrix.goarm }}" >> $GITHUB_ENV; fi

      - name: Resolve build metadata
        id: build_meta
        run: |
          set -e
          PANEL_VERSION="${RELEASE_TAG_INPUT}"
          case "$PANEL_VERSION" in
            v*) ;;
            *) PANEL_VERSION="v${PANEL_VERSION}" ;;
          esac
          SING_BOX_VERSION="$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)"
          SOURCE_FINGERPRINT="$(node scripts/release-source.mjs .)"
          [ "$SOURCE_FINGERPRINT" = "${{ needs.release-preflight.outputs.source-fingerprint }}" ] || { echo "product source fingerprint changed" >&2; exit 1; }
          [ -n "$SING_BOX_VERSION" ] || { echo "sing-box module version is empty" >&2; exit 1; }
          echo "panel_version=$PANEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "sing_box_version=$SING_BOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_fingerprint=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Bootlin musl compiler
        if: ${{ matrix.naive != true || matrix.compiler == 'bootlin' }}
        run: |
          set -e
          BOOTLIN_ARCH="${{ matrix.bootlin }}"
          TARBALL_NAME="${{ matrix.bootlin_archive }}"
          TARBALL_SHA256="${{ matrix.bootlin_sha256 }}"
          echo "Using pinned Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="${{ env.BOOTLIN_BASE_URL }}/$BOOTLIN_ARCH/tarballs/"
          echo "Downloading: $TARBALL_NAME"
          cd /tmp
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --connect-timeout 20 --retry 3 --retry-all-errors \
            -o "$TARBALL_NAME" "$TARBALL_BASE/$TARBALL_NAME"
          echo "$TARBALL_SHA256  $TARBALL_NAME" | sha256sum -c -
          tar -xf "$TARBALL_NAME"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          TOOLCHAIN_DIR="$(realpath "$TOOLCHAIN_DIR")"
          BIN_DIR="$TOOLCHAIN_DIR/bin"
          echo "PATH=$BIN_DIR:$PATH" >> $GITHUB_ENV
          CC=$(find "$BIN_DIR" -maxdepth 1 \( -name '*-gcc.br_real' -o -name '*-gcc' \) -type f -executable 2>/dev/null | grep -v g++ | head -n1)
          [ -z "$CC" ] && { echo "gcc not found in $BIN_DIR" >&2; exit 1; }
          echo "CC=$(realpath "$CC")" >> $GITHUB_ENV
          SYSROOT=""
          F=$(find "$TOOLCHAIN_DIR" -name "libc-header-start.h" 2>/dev/null | head -1)
          if [ -n "$F" ]; then SYSROOT=$(dirname "$(dirname "$(dirname "$(dirname "$F")")")"); fi
          if [ -n "$SYSROOT" ] && [ -d "$SYSROOT" ]; then
            echo "CGO_CFLAGS=--sysroot=$SYSROOT" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=--sysroot=$SYSROOT -static" >> $GITHUB_ENV
          fi

      - name: Build Solovey UI profiles
        env:
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -e
          [ -n "$SUI_RELEASE_TRUST_ROOTS_B64" ] || { echo "SUI_RELEASE_TRUST_ROOTS_B64 repository variable is required" >&2; exit 1; }
          printf '%s' "$SUI_RELEASE_TRUST_ROOTS_B64" > /tmp/solovey-release-trust-roots.b64
          node scripts/generate-component-imports.mjs --profile full --out app/components_generated.go
          export GOOS=linux GOARCH="${{ matrix.arch }}" CGO_ENABLED=1
          export CXX="${CXX:-$CC}"
          NAIVE_ARGS=()
          [ "${{ matrix.naive }}" = "true" ] && NAIVE_ARGS+=(--naive)
          rm -rf web/html
          mkdir -p web/html
          cp -a .release/frontend-full/. web/html/
          bash scripts/build-linux-target.sh --mode release --profile full \
            --out .release/linux-full --platform "${{ matrix.platform }}" \
            --trust-roots-file /tmp/solovey-release-trust-roots.b64 "${NAIVE_ARGS[@]}"
          cp -a .release/linux-full/. ./
          rm -rf web/html
          mkdir -p web/html
          cp -a .release/frontend-core/. web/html/
          bash scripts/build-linux-target.sh --mode release --profile core \
            --out .release/linux-core --platform "${{ matrix.platform }}" \
            --trust-roots-file /tmp/solovey-release-trust-roots.b64 "${NAIVE_ARGS[@]}"
          cp -a .release/linux-core/solovey-ui-core ./solovey-ui-core
          file solovey-ui
          file solovey-ui-core
          ldd solovey-ui 2>/dev/null || echo "Static binary confirmed"
          ldd solovey-ui-core 2>/dev/null || echo "Static core binary confirmed"
          {
            echo "app=solovey-ui"
            echo "profile=full"
            echo "version=${{ steps.build_meta.outputs.panel_version }}"
            echo "commit=${{ needs.release-preflight.outputs.product-commit }}"
            echo "source_fingerprint=${{ steps.build_meta.outputs.source_fingerprint }}"
            echo "platform=linux/${{ matrix.platform }}"
            echo "go=$(go version)"
            echo "sing_box=${{ steps.build_meta.outputs.sing_box_version }}"
          } > BUILD_INFO.full.txt
          {
            echo "app=solovey-ui"
            echo "profile=core"
            echo "version=${{ steps.build_meta.outputs.panel_version }}"
            echo "commit=${{ needs.release-preflight.outputs.product-commit }}"
            echo "source_fingerprint=${{ steps.build_meta.outputs.source_fingerprint }}"
            echo "platform=linux/${{ matrix.platform }}"
            echo "go=$(go version)"
            echo "sing_box=${{ steps.build_meta.outputs.sing_box_version }}"
          } > BUILD_INFO.core.txt

      - name: Package full profile
        run: |
          bash scripts/release-package-linux.sh \
            --target linux-${{ matrix.platform }} \
            --binary ./solovey-ui \
            --manager ./solovey-ui.sh \
            --service ./solovey-ui.service \
            --build-info ./BUILD_INFO.full.txt \
            --out-dir .

      - name: Package core profile
        run: |
          bash scripts/release-package-linux.sh \
            --profile core \
            --target linux-${{ matrix.platform }} \
            --binary ./solovey-ui-core \
            --manager ./solovey-ui.sh \
            --service ./solovey-ui.service \
            --build-info ./BUILD_INFO.core.txt \
            --out-dir .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solovey-ui-linux-${{ matrix.platform }}
          path: |
            ./solovey-ui-linux-${{ matrix.platform }}.tar.gz
            ./solovey-ui-linux-${{ matrix.platform }}.tar.gz.sha256
            ./solovey-ui-core-linux-${{ matrix.platform }}.tar.gz
            ./solovey-ui-core-linux-${{ matrix.platform }}.tar.gz.sha256
          retention-days: 1

  assemble-linux:
    name: Assemble and verify complete Linux release
    needs: [release-preflight, build-linux]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      notes_path: ${{ steps.vars.outputs.notes_path }}
    steps:
      - name: Check out repository (for release notes)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}
          fetch-depth: 1

      - name: Normalize release tag
        id: vars
        run: |
          TAG="${RELEASE_TAG_INPUT}"
          case "$TAG" in
            v*) echo "tag=$TAG" >> "$GITHUB_OUTPUT" ;;
            *) TAG="v$TAG"; echo "tag=$TAG" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          NOTES_FILE=".github/RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "notes_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download component frontend packs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: component-frontend-packs
          path: .release/components

      - name: Package component bundle
        run: |
          mkdir -p release-assets
          bash scripts/release-package-components.sh --components-dir .release/components --out-dir release-assets

      - name: Download Linux build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: solovey-ui-linux-*
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest
        env:
          SUI_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SUI_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          SUI_RELEASE_SIGNING_KEY_ID: ${{ vars.SUI_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -e
          [ -n "$SUI_RELEASE_SIGNING_PRIVATE_KEY_B64" ] || { echo "release signing secret is required" >&2; exit 1; }
          [ -n "$SUI_RELEASE_SIGNING_KEY_ID" ] || { echo "release signing key id variable is required" >&2; exit 1; }
          ISSUED_AT="$(date +%s)"
          RELEASE_SEQUENCE="$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))"
          CHANNEL=main
          [ "${{ steps.vars.outputs.prerelease }}" = "true" ] && CHANNEL=beta
          node scripts/release-manifest.mjs \
            --version "${{ steps.vars.outputs.version }}" \
            --sequence "$RELEASE_SEQUENCE" \
            --channel "$CHANNEL" \
            --issued-at "$ISSUED_AT" \
            --key-id "$SUI_RELEASE_SIGNING_KEY_ID" \
            --assets-dir release-assets \
            --components-dir .release/components

      - name: Verify complete signed release set
        env:
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: node scripts/release-verify.mjs release-assets "$RELEASE_TAG_INPUT"

      - name: Retain complete release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-linux-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  resume-candidate:
    name: Verify interrupted publication candidate
    if: inputs.resume_run_id != ''
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery orchestrator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Retain execution-only recovery verifier
        run: cp scripts/release-resume.mjs "$RUNNER_TEMP/release-resume.mjs"
      - name: Check out immutable product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}
          fetch-depth: 0
      - name: Verify source run, signed bytes, Windows checksums and existing registry
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          PRODUCT_COMMIT: ${{ needs.release-preflight.outputs.product-commit }}
          PRODUCT_FINGERPRINT: ${{ needs.release-preflight.outputs.source-fingerprint }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: node "$RUNNER_TEMP/release-resume.mjs"
      - name: Retain verified Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-linux-release
          path: release-assets/*
          if-no-files-found: error
      - name: Retain verified Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solovey-ui-windows-recovered
          path: windows-assets/*
          if-no-files-found: error

  publish-linux:
    name: Publish complete verified release
    needs: [release-preflight, assemble-linux, build-windows, build-docker, resume-candidate, test-installer, build-frontend, component-profile-checks]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || inputs.preflight_only == false) &&
      needs.release-preflight.result == 'success' && needs.test-installer.result == 'success' &&
      needs.build-frontend.result == 'success' && needs.component-profile-checks.result == 'success' &&
      ((inputs.resume_run_id != '' && needs.resume-candidate.result == 'success') ||
       (inputs.resume_run_id == '' && needs.assemble-linux.result == 'success' &&
        needs.build-windows.result == 'success' && needs.build-docker.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-preflight.outputs.product-commit }}

      - name: Download verified complete candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: complete-linux-release
          path: release-assets

      - name: Verify candidate at publication boundary
        env:
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: node scripts/release-verify.mjs release-assets "$RELEASE_TAG_INPUT"

      - name: Download Windows candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: solovey-ui-windows-*
          path: windows-assets
          merge-multiple: true

      - name: Verify complete Windows candidates
        run: node scripts/release-verify.mjs windows-assets "$RELEASE_TAG_INPUT" --windows

      - name: Refuse immutable release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT: ${{ needs.release-preflight.outputs.product-commit }}
        run: env GITHUB_SHA="$PRODUCT_COMMIT" node scripts/release-publish-gate.mjs before "$RELEASE_TAG_INPUT"

      - name: Resolve immutable release notes
        id: notes
        run: |
          NOTES_FILE=".github/RELEASE_NOTES_${RELEASE_TAG_INPUT}.md"
          if [ -f "$NOTES_FILE" ]; then echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to current repository Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ env.RELEASE_TAG_INPUT }}
          name: Solovey UI ${{ env.RELEASE_TAG_INPUT }}
          target_commitish: ${{ needs.release-preflight.outputs.product-commit }}
          prerelease: ${{ contains(env.RELEASE_TAG_INPUT, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
            windows-assets/*

      - name: Publish fully uploaded immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT: ${{ needs.release-preflight.outputs.product-commit }}
          RELEASE_TAG: ${{ env.RELEASE_TAG_INPUT }}
        run: |
          env GITHUB_SHA="$PRODUCT_COMMIT" node scripts/release-publish-gate.mjs uploaded "$RELEASE_TAG" release-assets windows-assets
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Publish signed channel release set
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT: ${{ needs.release-preflight.outputs.product-commit }}
        run: |
          set -euo pipefail
          CHANNEL=main
          [[ "$RELEASE_TAG_INPUT" == *-* ]] && CHANNEL=beta
          CHANNEL_TAG="channel-${CHANNEL}"
          if ! gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            CREATE_ARGS=(--target "$PRODUCT_COMMIT" --latest=false --title "Solovey UI ${CHANNEL} signed channel" --notes "Signed, expiring Solovey UI ${CHANNEL} release-set pointer. Artifact trust is established only by solovey-ui-release.json.")
            [ "$CHANNEL" = beta ] && CREATE_ARGS+=(--prerelease)
            gh release create "$CHANNEL_TAG" "${CREATE_ARGS[@]}"
          fi
          gh release upload "$CHANNEL_TAG" release-assets/* --clobber
