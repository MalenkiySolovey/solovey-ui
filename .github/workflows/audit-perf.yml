name: Audit Perf

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: audit-perf-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  bench-all:
    name: bench-all
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || contains(join(github.event.pull_request.labels.*.name, ','), 'run-perf') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Install pinned comparison tool
        run: node scripts/audit/install-tools.mjs benchstat
      - name: Compare isolated revisions on this runner
        id: regression
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASELINE_REF="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          CANDIDATE_REF="${PR_HEAD_SHA:-$(git rev-parse HEAD)}"
          node scripts/audit/performance.mjs --baseline "$BASELINE_REF" --candidate "$CANDIDATE_REF" --out tests/baseline/current
      - name: Comment advisory performance warning
        if: ${{ github.event_name == 'pull_request' && steps.regression.outputs.regression == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const rows = JSON.parse(fs.readFileSync('tests/baseline/current/perf-regressions.json', 'utf8'));
            const body = [
              'Advisory performance comparison: median ns/op increased by more than 20%.',
              '',
              ...rows.slice(0, 20).map(row => `- ${row.name}: ${row.ratio.toFixed(2)}x`),
              '',
              'Both revisions ran on this runner with the same toolchain, configuration and six samples. Inspect raw samples and benchstat before deciding whether a warning is noise or a regression.'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-perf-bench
          path: |
            tests/baseline/current/perf-baseline/**
            tests/baseline/current/perf-candidate/**
            tests/baseline/current/perf-identity.json
            tests/baseline/current/perf-comparison.json
            tests/baseline/current/benchstat.txt
            tests/baseline/current/perf-regressions.json
          if-no-files-found: error
          retention-days: 30