name: Management contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  contract:
    name: management-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - run: node scripts/verify-contract-pin.mjs
      - run: node --test scripts/verify-contract-pin.test.mjs
      - run: go test github.com/MalenkiySolovey/solovey-contracts/management/v1 ./contracts/management/v1 ./internal/managementcontract ./componenthost/supervisor
      - run: go test ./service ./service/datalifecycle -run TestManagementContract -count=1
