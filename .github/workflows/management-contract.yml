name: Management contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  contract:
    name: management-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
      - run: node scripts/verify-contract-pin.mjs
      - run: node --test scripts/verify-contract-pin.test.mjs
      - run: node scripts/verify-host-pin.mjs
      - run: node --test scripts/verify-host-pin.test.mjs
      - run: go test -count=1 ./service/resourceinventory
      - run: go test github.com/MalenkiySolovey/solovey-contracts/management/v1 ./contracts/management/v1 ./internal/managementcontract ./componenthost/supervisor
      - run: go test ./service ./service/datalifecycle -run TestManagementContract -count=1
