name: Audit Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: audit-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channel-main:
    name: Signed main channel expiry
    if: github.repository == 'MalenkiySolovey/solovey-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Verify the public stable update channel
        env:
          GH_TOKEN: ${{ github.token }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
          SOLOVEY_ARTIFACT_INFO: ${{ runner.temp }}/release-inspector
        run: |
          set -euo pipefail
          env GOWORK=off CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$SOLOVEY_ARTIFACT_INFO" ./cmd/solovey-artifact-info
          node scripts/release-channel.mjs check "$RUNNER_TEMP/channel-main"

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build audit dashboard
        shell: bash
        run: bash scripts/audit/aggregate.sh

      - name: Upload dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-dashboard
          path: |
            tests/baseline/current/summary.html
            tests/baseline/current/summary.json
            tests/baseline/current/aggregate.junit.xml
          if-no-files-found: ignore
          retention-days: 30
