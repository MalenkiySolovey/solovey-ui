name: Audit Frontend

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-frontend-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fe-lint:
    name: fe-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: deploy/dependencies/solovey-frontend.json
      - run: node scripts/frontend.mjs install
      - name: make audit:fe-lint
        run: make audit:fe-lint PS="pwsh -NoProfile -ExecutionPolicy Bypass"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-frontend-lint
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  fe-build:
    name: fe-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up component source resolver
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.extended.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
      - name: make audit:fe-build
        run: make audit:fe-build PS="pwsh -NoProfile -ExecutionPolicy Bypass"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-frontend-build
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
            .artifacts/frontend-dist/**
          if-no-files-found: ignore
          retention-days: 7

  fe-vitest:
    name: fe-vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up component source resolver
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.extended.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: deploy/dependencies/solovey-frontend.json
      - run: node scripts/frontend.mjs install
      - name: make audit:test-fe
        run: make audit:test-fe PS="pwsh -NoProfile -ExecutionPolicy Bypass"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-frontend-vitest
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  fe-e2e:
    name: fe-e2e
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: deploy/dependencies/solovey-frontend.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('deploy/dependencies/solovey-frontend.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: node scripts/frontend.mjs install
      - name: Install Playwright Chromium
        run: node scripts/frontend.mjs browser-install --with-deps chromium
      - name: Playwright e2e via local test server
        shell: bash
        env:
          SUI_E2E_READY_TIMEOUT_MS: "900000"
        run: |
          node scripts/frontend.mjs test:e2e
          test -s tests/baseline/e2e/a11y/axe-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-frontend-playwright
          path: |
            tests/baseline/e2e/playwright/**
            tests/baseline/e2e/playwright.junit.xml
            tests/baseline/e2e/e2e-server/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Axe report from the full browser suite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: audit-frontend-accessibility
          path: tests/baseline/e2e/a11y/axe-results.json
          if-no-files-found: ignore
          retention-days: 7
