    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Install staticcheck
        shell: bash
        run: |
          node scripts/audit/install-tools.mjs staticcheck
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: staticcheck
        shell: bash
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/baseline/run-command.ps1 -Group analysis -Name staticcheck -CommandLine "staticcheck ./..."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-staticcheck-${{ matrix.os }}
          path: |
            tests/baseline/analysis/staticcheck.txt
            tests/baseline/analysis/staticcheck.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  gosec:
    name: gosec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Install gosec
        shell: bash
        run: |
          node scripts/audit/install-tools.mjs gosec
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make audit:gosec
        shell: bash
        run: make audit:gosec PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-gosec-${{ matrix.os }}
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  govulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Install govulncheck
        shell: bash
        run: |
          node scripts/audit/install-tools.mjs govulncheck
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make audit:vuln
        shell: bash
        run: make audit:vuln PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-govulncheck-${{ matrix.os }}
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - vet
      - test-go
      - test-go-windows
      - test-go-race-linux
      - test-go-race-windows
      - test-go-windows-shard
      - test-go-race-linux-shard
      - test-go-race-windows-shard
      - coverage
      - lint-go
      - staticcheck
      - gosec
      - govulncheck
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Download audit job artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-go-*
          path: tests/baseline
          merge-multiple: false
      - name: Build audit dashboard
        shell: bash
        run: bash scripts/audit/aggregate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-dashboard
          path: |
            tests/baseline/current/summary.html
            tests/baseline/current/summary.json
            tests/baseline/current/aggregate.junit.xml
          if-no-files-found: ignore
          retention-days: 30
