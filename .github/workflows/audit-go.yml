name: Audit Go

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  MAKE_PS: pwsh -NoProfile -ExecutionPolicy Bypass

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: make audit:build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend
          SOLOVEY_UI_PROFILE=full npm run build --prefix frontend
          node scripts/frontend-assets.mjs publish --dist frontend/dist --destination web/html
          make audit:build PS="${MAKE_PS}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-build-${{ matrix.os }}
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
            tests/baseline/*/coverage/**
            tests/baseline/*/coverage.out
          if-no-files-found: ignore
          retention-days: 7

  vet:
    name: vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: make audit:vet
        shell: bash
        run: make audit:vet PS="${MAKE_PS}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-vet-${{ matrix.os }}
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  test-go:
    name: test-go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify Go test executor
        run: node --test scripts/go-test.test.mjs
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Materialize pinned OpenWrt test references
        run: node scripts/release-openwrt-references.mjs .github/build-inputs/OPENWRT_REFERENCE_LOCK.md --test-references
      - name: Install privileged fixture tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: make audit:test-go
        shell: bash
        run: make audit:test-go PS="${MAKE_PS}"
      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-test-${{ matrix.os }}
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  test-go-windows-shard:
    name: test-go-shard (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [1, 2, 3, 4]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify Go test executor
        run: node --test scripts/go-test.test.mjs
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Materialize pinned OpenWrt test references
        run: node scripts/release-openwrt-references.mjs .github/build-inputs/OPENWRT_REFERENCE_LOCK.md --test-references
      - name: Install privileged fixture tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: make audit:test-go
        shell: bash
        run: make audit:test-go PS="${MAKE_PS}" GO_TEST_ARGS="--shard-index ${SHARD_INDEX} --shard-total 4" GO_TEST_NAME_SUFFIX="-shard-${SHARD_INDEX}-of-4"
      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-test-${{ matrix.os }}-shard-${{ matrix.shard }}-of-4
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  test-go-windows:
    name: test-go (windows-latest)
    runs-on: ubuntu-latest
    if: always()
    needs: [test-go-windows-shard]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Require every shard to succeed
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs['test-go-windows-shard'].result }}
        run: ./tests/baseline/run-command.ps1 -Group core -Name go-test-windows-gate -CommandLine 'test "$SHARD_RESULT" = success'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-test-windows-latest-gate
          path: |
            tests/baseline/core/go-test-windows-gate.txt
            tests/baseline/core/go-test-windows-gate.junit.xml
          if-no-files-found: error
          retention-days: 7

  test-go-race-linux-shard:
    name: test-go-race-shard (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify Go test executor
        run: node --test scripts/go-test.test.mjs
      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Ensure make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Materialize pinned OpenWrt test references
        run: node scripts/release-openwrt-references.mjs .github/build-inputs/OPENWRT_REFERENCE_LOCK.md --test-references
      - name: Install privileged fixture tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: make audit:test-go-race
        shell: bash
        run: make audit:test-go-race PS="${MAKE_PS}" GO_TEST_ARGS="--shard-index ${SHARD_INDEX} --shard-total 4" GO_TEST_NAME_SUFFIX="-shard-${SHARD_INDEX}-of-4"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-go-race-${{ matrix.os }}-shard-${{ matrix.shard }}-of-4
          path: |
            tests/baseline/*/*.txt
            tests/baseline/*/*.junit.xml
          if-no-files-found: ignore
          retention-days: 7

  test-go-race-windows-shard:
    name: test-go-race-shard (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
