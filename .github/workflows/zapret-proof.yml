name: R8A frozen Linux restore qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  restore:
    name: Linux CGO restore (${{ matrix.change }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - change: held restore PR head
            sha: 84b32a01653c06cfef95fe1baee451d58a0d7fd9
            tree: 4af78ef5abe9545ef495f0473d40a69cb339b36a
          - change: combined Product tree
            sha: 80808d22ba00c66e55ae078136a2d1260598fed2
            tree: a566dbbd106d21ef3a0076b3f1c1f6bef19488e5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify pinned code under test
        env:
          EXACT_SHA: ${{ matrix.sha }}
          EXACT_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXACT_TREE"
          printf 'Testing commit %s tree %s\n' "$EXACT_SHA" "$EXACT_TREE"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify held import and ordinary restore using SQLite
        run: >-
          go test -race -p 2 -count=1 -timeout=5m -v
          -run '^TestIntegration(BackupEnvelopeRestorePreservesBackupTableCounts|RestoreRetainsUnresolvedZapretOnlyWithDeliberateCoreHold)$'
          ./database/backup
