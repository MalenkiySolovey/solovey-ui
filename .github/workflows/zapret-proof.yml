name: Zapret namespace qualification

on:
  pull_request:
    paths:
      - '.github/workflows/zapret-proof.yml'
      - 'components/zapret/**'
      - 'components/sources.lock.json'
      - 'network/planner/**'
      - 'network/nftables/zapret_*.go'
      - 'network/nftables/nft_backend.go'
      - 'internal/ops/privilegedbroker/zapret_socket*'
      - 'tests/installer/zapret-socket-runtime.sh'
      - 'deploy/systemd/solovey-ui-native-hardened.service'
      - 'deploy/systemd/solovey-privileged-broker.service'
      - 'scripts/generate-component-imports.mjs'
      - 'scripts/component-source-inputs.mjs'
      - 'internal/entities/outbounds/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.extended.mod'
      - 'go.extended.sum'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  zapret-namespace:
    name: Zapret namespace qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Verify bounded planner and canonical Outbound rejection
        run: |
          go test -count=1 ./network/planner ./network/nftables ./internal/entities/outbounds ./components/zapret
          go test -count=1 -run '^TestZapretSocket' ./internal/ops/privilegedbroker
          go test -count=1 -run '^TestComponentImportsStayBehindCompositionPackages$' ./internal/components/architecture
          go test -count=1 -run '^TestPreservationExecutableContainsInstalledDurableOwners$' ./cmd/solovey-openwrt-lifecycle ./cmd/solovey-openwrt-preservation
      - name: Prove provider handoff and probe the installed broker BPF boundary
        shell: bash
        run: bash tests/installer/zapret-socket-runtime.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the exact component engine and namespace fixture
        id: zapret-engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nftables ethtool libcap-dev libnetfilter-queue-dev libnfnetlink-dev libmnl-dev liblua5.4-dev zlib1g-dev
          node scripts/component-source-inputs.mjs prepare
          bash .component-sources/zapret/scripts/build-nfqws2.sh "$RUNNER_TEMP/zapret-engine"
          go test -c -tags zapretproof -o "$RUNNER_TEMP/zapret-proof" ./components/zapret
          go test -c -o "$RUNNER_TEMP/zapret-egress-proof" ./network/nftables
      - name: Exercise only loopback inside a disposable network namespace
        shell: bash
        run: |
          set -euo pipefail
          # Any modules loaded here belong to this disposable GitHub VM.
          test "$GITHUB_ACTIONS" = true
          sudo modprobe nf_conntrack || true
          sudo modprobe nfnetlink_queue || true
          sudo modprobe nft_queue || true
          sudo modprobe sch_ingress || true
          sudo modprobe cls_fw || true
          sudo modprobe act_gact || true
          if ! sudo unshare --net -- test -r /proc/net/netfilter/nfnetlink_queue; then
            echo 'PACKET_PATH_NOT_YET_PROVEN: runner cannot create a disposable network namespace with Linux NFQUEUE' | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'Needed: a disposable Linux runner with CAP_SYS_ADMIN, CAP_NET_ADMIN, nfnetlink_queue, nft_queue and conntrack accounting.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo chown root:root "$RUNNER_TEMP/zapret-proof"
          unit="solovey-zapret-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          sudo systemd-run --quiet --wait --pipe --collect --unit="$unit" \
            --setenv="SOLOVEY_TEST_PARENT_NETNS=$(readlink /proc/self/ns/net)" \
            --setenv="SOLOVEY_TEST_ENGINE_ROOT=$RUNNER_TEMP/zapret-engine" \
            --setenv="SOLOVEY_TEST_BROKER_UNIT=$unit" \
            /usr/bin/unshare --net -- /bin/bash -euc '
              test "$(readlink /proc/self/ns/net)" != "$SOLOVEY_TEST_PARENT_NETNS"
              test "$(readlink /proc/self/ns/net)" != "$(readlink /proc/1/ns/net)"
              sysctl -w net.netfilter.nf_conntrack_acct=1
              ip link set lo up
              exec "$1" -test.run "^TestZapretOutboundNamespace$" -test.v -test.timeout=60s
            ' _ "$RUNNER_TEMP/zapret-proof" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prove the independent guard on disposable routed egress
        if: ${{ !cancelled() && steps.zapret-engine.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          mountpoint="$RUNNER_TEMP/zapret-bpffs"
          mkdir -m 0700 "$mountpoint"
          # nfqws2 loads Lua after dropping its UID. The runner's home is not
          # a traverseable installed-artifact root for that user.
          engine="$(sudo mktemp -d /usr/local/lib/solovey-zapret-r8b1.XXXXXXXX)"
          trap 'sudo rm -f -- "$engine/nfqws2" "$engine/LICENSE.upstream" "$engine/source.json" "$engine/nfqueue-policy.c" "$engine/SHA256SUMS" "$engine/lua/zapret-lib.lua" "$engine/lua/zapret-antidpi.lua"; sudo rmdir -- "$engine/lua" "$engine"' EXIT
          sudo install -d -m 0755 "$engine/lua"
          sudo install -m 0755 "$RUNNER_TEMP/zapret-engine/nfqws2" "$engine/nfqws2"
          sudo install -m 0644 "$RUNNER_TEMP/zapret-engine/"{LICENSE.upstream,source.json,nfqueue-policy.c,SHA256SUMS} "$engine/"
          sudo install -m 0644 "$RUNNER_TEMP/zapret-engine/lua/"{zapret-lib.lua,zapret-antidpi.lua} "$engine/lua/"
          sudo chmod 0755 "$engine"
          (cd -- "$engine" && sha256sum --check --strict SHA256SUMS)
          exercise() {
            sudo unshare --mount --propagation private --net -- env \
              SOLOVEY_TEST_PARENT_NETNS="$(readlink /proc/self/ns/net)" \
              SOLOVEY_TEST_ENGINE_ROOT="$engine" \
              SOLOVEY_TEST_GUARD_ROOT="$mountpoint" bash -euc '
                mount -t bpf bpf -o mode=0700 "$SOLOVEY_TEST_GUARD_ROOT"
                sysctl -w net.netfilter.nf_conntrack_acct=1
                exec "$1" -test.run "^$2$" -test.v -test.timeout=45s
              ' _ "$1" "$2" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          guard_result=0
          exercise "$RUNNER_TEMP/zapret-egress-proof" TestZapretLinuxGatewaySnapshot || guard_result=$?
          exercise "$RUNNER_TEMP/zapret-egress-proof" TestZapretNativeGuardRoutedEgress || guard_result=$?
          exercise "$RUNNER_TEMP/zapret-proof" TestZapretRoutedStrategyWire
          test "$guard_result" -eq 0
