name: Stage2 Wave5 package qualification

# Goal-owned execution branch; main's CI remains unchanged.
on:
  workflow_dispatch:
    inputs:
      qualify_windows_core_build:
        type: boolean
        default: false
        description: Build missing Core archives from the sealed full candidate without runtime replay
      qualify_builds_only:
        type: boolean
        default: false
        description: Build exact candidate packages while retaining independent native runtime evidence
      qualify_listener_metadata_probe:
        type: boolean
        default: false
        description: Isolate exact PID listener inventory without product or compiler
      qualify_private_metadata_probe:
        type: boolean
        default: false
        description: Diagnose Windows ARM64 private fixture child-process input without product builds
      qualify_docker_carrier:
        type: boolean
        default: false
        description: Reuse sealed native Docker ARM64 image for Naive carriers and parent lifecycle
      qualify_carrier_tls:
        type: boolean
        default: false
        description: Reuse sealed Windows ARM64 full/Core packages for native Naive and TLS witnesses
      qualify_linux:
        type: boolean
        default: false
        description: Build and exercise native Linux systemd candidates
      qualify_paired_dns:
        type: boolean
        default: false
        description: Reuse sealed packages for paired native DNS intent
      qualify_docker_maintenance:
        type: boolean
        default: false
        description: Reuse sealed ARM Docker image for synthetic old-volume maintenance
      qualify_windows:
        type: boolean
        default: true
        description: Also build and exercise native Windows packages
      qualify_docker:
        type: boolean
        default: false
        description: Also build and exercise Docker ARM64

permissions:
  contents: read
  actions: read

env:
  W5_PRODUCT_COMMIT: 2312e83bc92b2f67596c529776ddc79c02b88ad2

jobs:
  windows-listener-metadata-probe:
    name: Native Windows ARM64 PID listener RCA
    if: inputs.qualify_listener_metadata_probe
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
          architecture: arm64
      - name: Compare legacy and native PowerShell TCP inventory
        shell: pwsh
        run: node .qualification/native-windows-extra/listener-metadata-probe.mjs WINDOWS_LISTENER_METADATA_RCA.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w5-windows-arm64-listener-metadata-rca
          path: WINDOWS_LISTENER_METADATA_RCA.json
          retention-days: 7

  windows-private-metadata-probe:
    name: Native Windows ARM64 private fixture RCA
    if: inputs.qualify_private_metadata_probe
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
          architecture: arm64
      - name: Isolate legacy PowerShell parent without product or compiler
        shell: powershell
        run: |
          node .qualification/native-windows-extra/private-metadata-probe.mjs WINDOWS_PRIVATE_METADATA_LEGACY_PARENT.json input-only
          $global:LASTEXITCODE=0
      - name: Compare original console input with exact private ACL environment input
        env:
          W5_FIXTURE_COMMIT: ${{ github.sha }}
        run: |
          node .qualification/native-windows-extra/private-metadata-probe.mjs WINDOWS_PRIVATE_METADATA_HARNESS_RCA.json
          if($LASTEXITCODE -ne 0){throw 'BEFORE_TOOLING_METADATA_FAILED'}
          $w5Baseline=@{}
          foreach($w5Key in @('Path','PSModulePath','SystemRoot','WINDIR','ComSpec','PATHEXT')){$w5Baseline[$w5Key]=[Environment]::GetEnvironmentVariable($w5Key)}
          $w5Baseline | ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath "$env:RUNNER_TEMP/w5-native-child-environment.json"
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: false
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit
      - name: Compare post-tooling environment with preserved native child environment
        env:
          W5_FIXTURE_COMMIT: ${{ github.sha }}
        run: |
          $env:W5_POWERSHELL_BASELINE_FILE="$env:RUNNER_TEMP/w5-native-child-environment.json"
          node .qualification/native-windows-extra/private-metadata-probe.mjs WINDOWS_PRIVATE_METADATA_AFTER_TOOLING.json
          if($LASTEXITCODE -ne 0){throw 'PRESERVED_NATIVE_CHILD_METADATA_FAILED'}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w5-windows-arm64-private-metadata-rca
          path: WINDOWS_PRIVATE_METADATA*.json
          retention-days: 7

  docker-arm-carrier:
    name: Sealed native Docker ARM64 Naive carriers
    if: inputs.qualify_docker_carrier
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: .runtime/fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: w5-docker-arm64-runtime
          run-id: 38166107316
          github-token: ${{ github.token }}
          path: .runtime/sealed-arm-image
      - name: Authenticate native host and existing exact image without rebuilding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          test "$(uname -m)" = aarch64
          test "$(go env GOHOSTARCH)" = arm64
          test "$(go env GOVERSION)" = go1.26.9
          test "$(node -p process.arch)" = arm64
          test "$(sha256sum .runtime/sealed-arm-image/docker-arm64-candidate.tar.gz | cut -d ' ' -f1)" = 3c2e9db0ce67143bc0b01f8d14696b3c9e1a8d6637dc1d0f1a591e34df935bef
          docker load -i .runtime/sealed-arm-image/docker-arm64-candidate.tar.gz
          test "$(docker image inspect sha256:3dbf9ae8209b8ad196d01aa8ebb381d0a439e6d039480beeb3b08a742dff2f63 --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect sha256:3dbf9ae8209b8ad196d01aa8ebb381d0a439e6d039480beeb3b08a742dff2f63 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$W5_PRODUCT_COMMIT"
          mkdir -p .runtime/qualification-carrier
          docker image inspect sha256:3dbf9ae8209b8ad196d01aa8ebb381d0a439e6d039480beeb3b08a742dff2f63 --format '{{json .Config}}' > .runtime/qualification-carrier/SEALED_IMAGE_CONFIG.json
          uname -a > .runtime/qualification-carrier/NATIVE_HOST_OS.txt
          docker version --format '{{json .Server}}' > .runtime/qualification-carrier/DOCKER_SERVER.json
      - name: Compile only scoped peers and install locked API client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          fixture=.runtime/fixture-driver/.qualification
          peers="$fixture/native-docker-arm-carriers"
          cp "$fixture/native-package-fixture.go.txt" "$RUNNER_TEMP/native-fixture.go"
          CGO_ENABLED=1 GOWORK=off GOTOOLCHAIN=local go build -mod=readonly -tags with_quic -o "$RUNNER_TEMP/native-fixture" "$RUNNER_TEMP/native-fixture.go"
          for kind in private-api-probe udp-loopback-witness; do
            cp "$fixture/$kind.go.txt" "$RUNNER_TEMP/$kind.go"
            CGO_ENABLED=0 GOWORK=off GOTOOLCHAIN=local go build -mod=readonly -o "$RUNNER_TEMP/$kind" "$RUNNER_TEMP/$kind.go"
          done
          for kind in echo wire parent network-probe; do
            cp "$peers/$kind.go.txt" "$RUNNER_TEMP/naive-$kind.go"
            CGO_ENABLED=0 GOWORK=off GOTOOLCHAIN=local go build -mod=readonly -o "$peers/naive-portable-$kind-linux-arm64" "$RUNNER_TEMP/naive-$kind.go"
          done
          chmod 755 "$peers" "$peers"/naive-portable-*-linux-arm64
          for file in "$RUNNER_TEMP/native-fixture" "$RUNNER_TEMP/private-api-probe" "$RUNNER_TEMP/udp-loopback-witness" "$peers"/naive-portable-*-linux-arm64; do
            go version -m "$file"
            sha256sum "$file"
          done > .runtime/qualification-carrier/FIXTURE_BUILD_INFO.txt
          cd frontend
          npm ci
      - name: Run actual nonroot readonly native ARM Naive carriers and parent closure
        run: |
          set -euo pipefail
          peers=.runtime/fixture-driver/.qualification/native-docker-arm-carriers
          node "$peers/native-package-runtime.mjs" \
            --image sha256:3dbf9ae8209b8ad196d01aa8ebb381d0a439e6d039480beeb3b08a742dff2f63 \
            --helper "$RUNNER_TEMP/native-fixture" --private-probe "$RUNNER_TEMP/private-api-probe" \
            --udp-witness "$RUNNER_TEMP/udp-loopback-witness" --naive-peer-root "$peers" \
            --browser-module "$peers/naive-contract.mjs" --frontend frontend \
            --output .runtime/qualification-carrier/RUNTIME.json --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}'
          cp "$peers/DOCKER_NAIVE_NATIVE_CARRIERS_AND_PARENT.json" .runtime/qualification-carrier/
          cp "$peers/PROVENANCE.json" .runtime/qualification-carrier/FIXTURE_SOURCE_PROVENANCE.json
      - name: Retain sanitized scoped reports without another image export
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w5-docker-arm64-naive-carriers
          path: .runtime/qualification-carrier
          retention-days: 7

  windows-carrier-tls:
    name: Sealed native Windows ARM64 carrier and TLS
    if: inputs.qualify_carrier_tls
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: .runtime/fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
          architecture: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: solovey-ui-windows-arm64
          run-id: 38166107316
          github-token: ${{ github.token }}
          path: .runtime/sealed-full
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: w5-windows-arm64-runtime
          run-id: 38166107316
          github-token: ${{ github.token }}
          path: .runtime/sealed-core
      - name: Authenticate existing full and Core packages without rebuilding
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:W5_PRODUCT_COMMIT){throw 'EXACT_PINNED_SOURCE_REQUIRED'}
          if((node -p process.arch).Trim() -ne 'arm64'){throw 'ACTUAL_NATIVE_ARM64_NODE_REQUIRED'}
          if((go env GOHOSTARCH).Trim() -ne 'arm64'){throw 'ACTUAL_NATIVE_ARM64_GO_REQUIRED'}
          if((go env GOVERSION).Trim() -ne 'go1.26.9'){throw 'PINNED_GO_1_26_9_REQUIRED'}
          $cases=@(
            @{profile='full';archive='.runtime/sealed-full/solovey-ui-windows-arm64.zip';sha='13c9b641e24792963dd5b88d16aa6c8560f7a0f90a1735e55ecfd4640a9d0ec2';package='solovey-ui-windows'},
            @{profile='core';archive='.runtime/sealed-core/solovey-ui-core-windows-arm64.zip';sha='b4639c407423874e9a193ac7b2e32050c840b8a1333f86d6b7fdc5044f58e698';package='candidate-core'}
          )
          New-Item -ItemType Directory -Path .runtime/qualification-extra -Force | Out-Null
          foreach($case in $cases){
            if((Get-FileHash -LiteralPath $case.archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $case.sha){throw 'SEALED_ARCHIVE_SHA_MISMATCH'}
            Expand-Archive -LiteralPath $case.archive -DestinationPath ".runtime/existing-$($case.profile)"
            $metadata=Get-Content -LiteralPath ".runtime/existing-$($case.profile)/$($case.package)/BUILD_INFO.txt" -Raw
            foreach($pin in @($env:W5_PRODUCT_COMMIT,'af4f906729368f2bfa5efef123721c350ed27b8f486d875a180d12bf2099676a','d0feb7cd0e3cfd46a2a90c06be901c6c87aaeed8','b2eea8ca8762dd1e438171e2f7b56f9715c30cbb','8f440972b353f7ace3bbfbac9cf291938de5ab19')){if(!$metadata.Contains($pin)){throw 'PINNED_PACKAGE_SOURCE_PROVENANCE_REQUIRED'}}
            New-Item -ItemType Directory -Path ".runtime/qualification-extra/$($case.profile)" -Force | Out-Null
            Copy-Item -LiteralPath ".runtime/existing-$($case.profile)/$($case.package)/BUILD_INFO.txt" -Destination ".runtime/qualification-extra/$($case.profile)/BUILD_INFO.txt"
          }
          [pscustomobject]@{source=$env:W5_PRODUCT_COMMIT;fixture='${{ github.sha }}';artifactRun=38166107316;nativeNode=(node -p process.arch).Trim();nativeGo=(go env GOHOSTARCH).Trim();release=[System.Environment]::OSVersion.VersionString;rebuilt=$false;packages=$cases} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath .runtime/qualification-extra/SEALED_PACKAGE_REUSE.json
      - name: Preserve native PowerShell child environment before MSYS tooling
        shell: pwsh
        run: |
          $w5Baseline=@{}
          foreach($w5Key in @('Path','PSModulePath','SystemRoot','WINDIR','ComSpec','PATHEXT')){$w5Baseline[$w5Key]=[Environment]::GetEnvironmentVariable($w5Key)}
          $w5Baseline | ConvertTo-Json | Set-Content -Encoding utf8 -LiteralPath "$env:RUNNER_TEMP/w5-native-child-environment.json"
          "W5_POWERSHELL_BASELINE_FILE=$env:RUNNER_TEMP/w5-native-child-environment.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Reuse the existing native ARM64 fixture compiler
        id: extra-msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit
      - name: Compile only scoped fixture peers and install locked API client
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.extra-msys2.outputs.msys2-location }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          test "$(go env GOHOSTARCH)" = arm64
          test "$(node -p process.arch)" = arm64
          export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
          export CC=clang CGO_ENABLED=1 GOWORK=off GOTOOLCHAIN=local
          fixture=.runtime/fixture-driver/.qualification
          peers="$fixture/native-windows-extra"
          cp "$fixture/native-package-fixture.go.txt" "$RUNNER_TEMP/native-fixture.go"
          go build -mod=readonly -tags with_quic -o "$RUNNER_TEMP/native-fixture.exe" "$RUNNER_TEMP/native-fixture.go"
          cp "$fixture/udp-loopback-witness.go.txt" "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 go build -mod=readonly -o "$RUNNER_TEMP/udp-witness.exe" "$RUNNER_TEMP/udp-witness.go"
          for kind in echo wire parent; do
            cp "$peers/$kind.go.txt" "$RUNNER_TEMP/$kind.go"
            CGO_ENABLED=0 go build -mod=readonly -o "$peers/naive-portable-$kind-windows-arm64.exe" "$RUNNER_TEMP/$kind.go"
          done
          cp "$peers/autohttps.go.txt" "$RUNNER_TEMP/autohttps.go"
          CGO_ENABLED=0 go build -mod=readonly -o "$peers/autohttps-windows-peer-arm64.exe" "$RUNNER_TEMP/autohttps.go"
          cp "$peers/tls-material.go.txt" "$RUNNER_TEMP/tls-material.go"
          CGO_ENABLED=0 go build -mod=readonly -o "$peers/fixture-tls-material-windows-arm64.exe" "$RUNNER_TEMP/tls-material.go"
          for file in "$RUNNER_TEMP/native-fixture.exe" "$RUNNER_TEMP/udp-witness.exe" "$peers"/*.exe; do
            go version -m "$file"
            sha256sum "$file"
          done > .runtime/qualification-extra/FIXTURE_BUILD_INFO.txt
          cd frontend
          npm ci
      - name: Execute full and Core native carrier and TLS witnesses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $w5Peers='.runtime/fixture-driver/.qualification/native-windows-extra'
          node "$w5Peers/private-metadata-probe.mjs" .runtime/qualification-extra/WINDOWS_PRIVATE_METADATA_HARNESS_RCA.json
          if($LASTEXITCODE -ne 0){throw 'NATIVE_PRIVATE_METADATA_PREFLIGHT_FAILED'}
          foreach($w5Profile in @('full','core')){
            $w5Package=if($w5Profile -eq 'core'){'candidate-core'}else{'solovey-ui-windows'}
            $env:W5_NATIVE_PROFILE=$w5Profile
            node "$w5Peers/native-package-runtime.mjs" --binary ".runtime/existing-$w5Profile/$w5Package/sui.exe" `
              --helper "$env:RUNNER_TEMP/native-fixture.exe" --udp-witness "$env:RUNNER_TEMP/udp-witness.exe" `
              --browser-module "$w5Peers/exercise-all.mjs" --frontend frontend `
              --output ".runtime/qualification-extra/$w5Profile/RUNTIME.json" `
              --commit $env:W5_PRODUCT_COMMIT --fixture-commit '${{ github.sha }}' --private-api-check true
            $w5Exit=$LASTEXITCODE
            Get-ChildItem -LiteralPath $w5Peers -Filter "WINDOWS_*_$w5Profile.json" | Copy-Item -Destination ".runtime/qualification-extra/$w5Profile/"
            if($w5Exit -ne 0){throw 'NATIVE_SCOPED_TLS_RUNTIME_FAILED'}
          }
          Copy-Item -LiteralPath "$w5Peers/PROVENANCE.json" -Destination .runtime/qualification-extra/FIXTURE_SOURCE_PROVENANCE.json
      - name: Retain sanitized scoped reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w5-windows-arm64-carrier-tls
          path: .runtime/qualification-extra
          retention-days: 7

  windows-build:
    if: inputs.qualify_windows
    uses: ./.github/workflows/windows.yml
    with:
      source_commit: 2312e83bc92b2f67596c529776ddc79c02b88ad2
      tag: v2026.3.3
      preflight_only: true

  windows-runtime:
    name: Native packaged Windows ${{ matrix.arch }}
    if: inputs.qualify_windows && !inputs.qualify_builds_only
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .runtime/fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: solovey-ui-windows-${{ matrix.arch }}
          path: .runtime/candidate-archive
      - name: Authenticate and extract produced package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $archive=".runtime/candidate-archive/solovey-ui-windows-${{ matrix.arch }}.zip"
          $expected=(Get-Content -LiteralPath "$archive.sha256" -Raw).Split(' ')[0].Trim()
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Candidate archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath .runtime/candidate-package
          $metadata=Get-Content -LiteralPath '.runtime/candidate-package/solovey-ui-windows/BUILD_INFO.txt' -Raw
          if (!$metadata.Contains("commit=$env:W5_PRODUCT_COMMIT")) { throw 'Candidate source mismatch' }
          New-Item -ItemType Directory -Path .runtime/qualification-evidence -Force | Out-Null
          Copy-Item -LiteralPath '.runtime/candidate-package/solovey-ui-windows/BUILD_INFO.txt' -Destination '.runtime/qualification-evidence/BUILD_INFO.txt'
      - name: Native ARM64 C toolchain
        id: msys2
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit
      - name: Compile standalone fixture against exact candidate source
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          export CGO_ENABLED=1 GOWORK=off
          if [ '${{ matrix.arch }}' = arm64 ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
            export CC=clang
          else
            export CC=gcc
          fi
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          cp .runtime/fixture-driver/.qualification/native-package-fixture.go.txt "$RUNNER_TEMP/native-fixture.go"
          go build -tags with_quic -o "$RUNNER_TEMP/native-fixture.exe" "$RUNNER_TEMP/native-fixture.go"
          cp .runtime/fixture-driver/.qualification/udp-loopback-witness.go.txt "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/udp-witness.exe" "$RUNNER_TEMP/udp-witness.go"
          if [ '${{ matrix.arch }}' = arm64 ]; then
            go test -tags with_quic ./internal/entities/ssmcache ./core/registry ./database/backup ./service github.com/sagernet/sing-box/service/ssmapi \
              -run 'Test(SSM|OwnedTreeWindows|WindowsSDDL|Cache|OptionalCache)' -count=1 > .runtime/qualification-evidence/SSM_FOCUSED.txt
          fi
          go version -m .runtime/candidate-package/solovey-ui-windows/sui.exe > .runtime/qualification-evidence/GO_BUILD_INFO.txt
      - name: Actual packaged runtime with loopback synthetic state
        shell: bash
        run: |
          node .runtime/fixture-driver/.qualification/native-package-runtime.mjs \
            --binary .runtime/candidate-package/solovey-ui-windows/sui.exe \
            --helper "$RUNNER_TEMP/native-fixture.exe" --udp-witness "$RUNNER_TEMP/udp-witness.exe" --output .runtime/qualification-evidence/RUNTIME.json \
            --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}' --private-api-check true
      - name: Build and exercise native Core profile with its own verified frontend
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -euo pipefail
          test -n "$SUI_RELEASE_TRUST_ROOTS_B64"
          export CGO_ENABLED=1 GOWORK=off GOOS=windows GOARCH='${{ matrix.arch }}'
          if [ '${{ matrix.arch }}' = arm64 ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
            export CC=clang
          else
            export CC=gcc
          fi
          cd frontend
          npm ci
          SOLOVEY_UI_PROFILE=core npm run build
          cd ..
          node scripts/check-frontend-profile.mjs --profile core --dist frontend/dist
          node scripts/frontend-assets.mjs publish --dist frontend/dist --destination web/html
          mkdir -p .runtime/candidate-core .runtime/qualification-evidence/core
          tags=with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_tailscale,minimal
          go build -trimpath -buildvcs=false -tags "$tags" -ldflags="-buildid= -w -s -checklinkname=0 -X github.com/MalenkiySolovey/solovey-ui/config/update.ReleaseTrustRootsBase64=$SUI_RELEASE_TRUST_ROOTS_B64" -o .runtime/candidate-core/sui.exe main.go
          cp .runtime/candidate-package/solovey-ui-windows/libcronet.dll .runtime/candidate-core/libcronet.dll
          {
            printf 'version=v2026.3.3\ncommit=%s\nplatform=windows/${{ matrix.arch }}\nprofile=core\n' "$W5_PRODUCT_COMMIT"
            printf 'source_fingerprint=%s\n' "$(node scripts/release-source.mjs .)"
            node scripts/quic-integration-provenance.mjs build-info
            node scripts/ssm-integration-provenance.mjs build-info
            node scripts/anytls-integration-provenance.mjs build-info
          } > .runtime/candidate-core/BUILD_INFO.txt
          cp .runtime/candidate-core/BUILD_INFO.txt .runtime/qualification-evidence/core/BUILD_INFO.txt
          go version -m .runtime/candidate-core/sui.exe > .runtime/qualification-evidence/core/GO_BUILD_INFO.txt
          node .runtime/fixture-driver/.qualification/native-package-runtime.mjs \
            --binary .runtime/candidate-core/sui.exe --helper "$RUNNER_TEMP/native-fixture.exe" --udp-witness "$RUNNER_TEMP/udp-witness.exe" \
            --output .runtime/qualification-evidence/core/RUNTIME.json --commit "$W5_PRODUCT_COMMIT" \
            --fixture-commit '${{ github.sha }}' --private-api-check true
      - name: Retain the independently built Core candidate
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path -LiteralPath '.runtime/candidate-core/sui.exe') {
            New-Item -ItemType Directory -Path .runtime/qualification-evidence -Force | Out-Null
            $archive='.runtime/qualification-evidence/solovey-ui-core-windows-${{ matrix.arch }}.zip'
            Compress-Archive -LiteralPath .runtime/candidate-core -DestinationPath $archive -CompressionLevel Optimal
            $hash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  solovey-ui-core-windows-${{ matrix.arch }}.zip" | Set-Content -LiteralPath "$archive.sha256"
          }
      - name: Retain sanitized runtime evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w5-windows-${{ matrix.arch }}-runtime
          path: .runtime/qualification-evidence
          retention-days: 4

  docker-runtime:
    name: Native packaged Docker arm64
    if: inputs.qualify_docker
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .runtime/fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Require exact source, native architecture and public trust roots
        env:
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          test "$(uname -m)" = aarch64
          test -n "$SUI_RELEASE_TRUST_ROOTS_B64"
          test "$(go env GOHOSTARCH)" = arm64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Load canonical Dockerfile candidate locally without publication
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: solovey-w5-candidate:arm64
          labels: org.opencontainers.image.revision=${{ env.W5_PRODUCT_COMMIT }}
          build-args: |
            SUI_RELEASE_TRUST_ROOTS_B64=${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64
      - name: Compile fixture and run actual non-root candidate
        if: '!inputs.qualify_builds_only'
        run: |
          set -euo pipefail
          mkdir -p .runtime/qualification-evidence
          cp .runtime/fixture-driver/.qualification/native-package-fixture.go.txt "$RUNNER_TEMP/native-fixture.go"
          CGO_ENABLED=1 GOWORK=off go build -tags with_quic -o "$RUNNER_TEMP/native-fixture" "$RUNNER_TEMP/native-fixture.go"
          cp .runtime/fixture-driver/.qualification/private-api-probe.go.txt "$RUNNER_TEMP/private-api-probe.go"
          CGO_ENABLED=0 GOWORK=off go build -o "$RUNNER_TEMP/private-api-probe" "$RUNNER_TEMP/private-api-probe.go"
          cp .runtime/fixture-driver/.qualification/udp-loopback-witness.go.txt "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 GOWORK=off go build -o "$RUNNER_TEMP/udp-witness" "$RUNNER_TEMP/udp-witness.go"
          node .runtime/fixture-driver/.qualification/native-package-runtime.mjs \
            --image solovey-w5-candidate:arm64 --helper "$RUNNER_TEMP/native-fixture" \
            --output .runtime/qualification-evidence/RUNTIME.json --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}' \
            --private-probe "$RUNNER_TEMP/private-api-probe" --udp-witness "$RUNNER_TEMP/udp-witness" --persist-restart true
      - name: Preserve locally built candidate even when a runtime assertion fails
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .runtime/qualification-evidence
          if docker image inspect solovey-w5-candidate:arm64 >/dev/null 2>&1; then
            docker save solovey-w5-candidate:arm64 | gzip -1 > .runtime/qualification-evidence/docker-arm64-candidate.tar.gz
            sha256sum .runtime/qualification-evidence/docker-arm64-candidate.tar.gz > .runtime/qualification-evidence/docker-arm64-candidate.tar.gz.sha256
          fi
      - name: Retain candidate image and sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w5-docker-arm64-runtime
          path: .runtime/qualification-evidence
          retention-days: 4
  linux-build:
    name: Canonical Linux candidate ${{ matrix.arch }}
    if: inputs.qualify_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: .runtime/fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
      - name: Reuse canonical pinned Cronet compiler owner
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/cronet-go"
          git -C "$RUNNER_TEMP/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go" fetch --depth=1 origin 7e27f60f7f04a1c762b6bb69b4a44d7b24cd7a5d
          git -C "$RUNNER_TEMP/cronet-go" checkout FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cronet-go" rev-parse HEAD)" = 7e27f60f7f04a1c762b6bb69b4a44d7b24cd7a5d
          git -C "$RUNNER_TEMP/cronet-go" submodule update --init --recursive --depth=1
          cd "$RUNNER_TEMP/cronet-go"
          rm -f naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            test -z "$line" || printf '%s\n' "$line" >> "$GITHUB_ENV"
          done
      - name: Build full and Core through canonical producers
        env:
          W5_TARGET_ARCH: ${{ matrix.arch }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: bash .runtime/fixture-driver/.qualification/linux-systemd-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: w5-linux-${{ matrix.arch }}-candidates
          path: .runtime/qualification-evidence
          retention-days: 4

  linux-systemd-runtime:
    name: Native systemd Linux ${{ matrix.arch }}
    if: inputs.qualify_linux
    needs: linux-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: .runtime/fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: w5-linux-${{ matrix.arch }}-candidates
          path: .runtime/candidate-packages
      - name: Require native architecture and actual PID1 systemd
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          test "$(cat /proc/1/comm)" = systemd
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1;; esac
          cat /etc/os-release > .runtime/candidate-packages/NATIVE_HOST_OS.txt
          uname -a >> .runtime/candidate-packages/NATIVE_HOST_OS.txt
      - name: Compile independent authenticated clients and private API witness
        run: |
          set -euo pipefail
          cp .runtime/fixture-driver/.qualification/native-package-fixture.go.txt "$RUNNER_TEMP/native-fixture.go"
          CGO_ENABLED=1 CC=gcc go build -tags with_quic -o "$RUNNER_TEMP/native-fixture" "$RUNNER_TEMP/native-fixture.go"
          cp .runtime/fixture-driver/.qualification/udp-loopback-witness.go.txt "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/udp-witness" "$RUNNER_TEMP/udp-witness.go"
      - name: Run exact full and Core candidates under canonical hardening
        run: |
          set -euo pipefail
          (
            cd .runtime/candidate-packages
            sha256sum -c "solovey-ui-linux-${{ matrix.arch }}.tar.gz.sha256"
            sha256sum -c "solovey-ui-core-linux-${{ matrix.arch }}.tar.gz.sha256"
          )
          fixture="/run/solovey-w5-${GITHUB_RUN_ID}-${{ matrix.arch }}"
          test ! -e "$fixture"
          sudo -n install -d -m 0755 "$fixture"
          sudo -n install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$fixture/private"
          mkdir -p .runtime/qualification-evidence
          cp .runtime/candidate-packages/NATIVE_HOST_OS.txt .runtime/qualification-evidence/
          for profile in full core; do
            archive=".runtime/candidate-packages/solovey-ui-linux-${{ matrix.arch }}.tar.gz"
            test "$profile" != core || archive=".runtime/candidate-packages/solovey-ui-core-linux-${{ matrix.arch }}.tar.gz"
            sudo -n install -d -m 0755 "$fixture/$profile"
            sudo -n tar -xzf "$archive" -C "$fixture/$profile"
            binary=$(find "$fixture/$profile" -type f -name 'solovey-ui' -o -type f -name 'solovey-ui-core')
            test "$(printf '%s\n' "$binary" | wc -l)" = 1
            node .runtime/fixture-driver/.qualification/native-package-runtime.mjs \
              --binary "$binary" --helper "$RUNNER_TEMP/native-fixture" --udp-witness "$RUNNER_TEMP/udp-witness" \
              --output ".runtime/qualification-evidence/${profile}-RUNTIME.json" --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}' \
              --systemd true --systemd-policy deploy/systemd/solovey-ui-native-hardened.service --fixture-base "$fixture/private" --private-api-check true
          done
          test "$(realpath "$fixture")" = "$fixture"
          test -z "$(find "$fixture/private" -mindepth 1 -maxdepth 1 -type d)"
          sudo -n rm -rf -- "$fixture"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: w5-linux-${{ matrix.arch }}-systemd-runtime
          path: .runtime/qualification-evidence
          retention-days: 4

  linux-paired-dns:
    name: Paired packaged DNS on native Linux systemd
    if: inputs.qualify_paired_dns
    runs-on: ubuntu-24.04
    steps:
