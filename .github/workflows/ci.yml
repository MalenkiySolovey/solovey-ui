name: Stage2 Wave5 package qualification

# Goal-owned execution branch; main's CI remains unchanged.
on:
  workflow_dispatch:
    inputs:
      qualify_linux:
        type: boolean
        default: false
        description: Build and exercise native Linux systemd candidates
      qualify_windows:
        type: boolean
        default: true
        description: Also build and exercise native Windows packages
      qualify_docker:
        type: boolean
        default: false
        description: Also build and exercise Docker ARM64

permissions:
  contents: read
  actions: read

env:
  W5_PRODUCT_COMMIT: ec534be49a9141a45743b035077ebfa5c0148208

jobs:
  windows-build:
    if: inputs.qualify_windows
    uses: ./.github/workflows/windows.yml
    with:
      source_commit: ec534be49a9141a45743b035077ebfa5c0148208
      tag: v2026.3.3
      preflight_only: true

  windows-runtime:
    name: Native packaged Windows ${{ matrix.arch }}
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: solovey-ui-windows-${{ matrix.arch }}
          path: candidate-archive
      - name: Authenticate and extract produced package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $archive="candidate-archive/solovey-ui-windows-${{ matrix.arch }}.zip"
          $expected=(Get-Content -LiteralPath "$archive.sha256" -Raw).Split(' ')[0].Trim()
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Candidate archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath candidate-package
          $metadata=Get-Content -LiteralPath 'candidate-package/solovey-ui-windows/BUILD_INFO.txt' -Raw
          if (!$metadata.Contains("commit=$env:W5_PRODUCT_COMMIT")) { throw 'Candidate source mismatch' }
          New-Item -ItemType Directory -Path qualification-evidence -Force | Out-Null
          Copy-Item -LiteralPath 'candidate-package/solovey-ui-windows/BUILD_INFO.txt' -Destination 'qualification-evidence/BUILD_INFO.txt'
      - name: Native ARM64 C toolchain
        id: msys2
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
          path-type: inherit
      - name: Compile standalone fixture against exact candidate source
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          export CGO_ENABLED=1 GOWORK=off
          if [ '${{ matrix.arch }}' = arm64 ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
            export CC=clang
          else
            export CC=gcc
          fi
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          cp fixture-driver/.qualification/native-package-fixture.go.txt "$RUNNER_TEMP/native-fixture.go"
          go build -tags with_quic -o "$RUNNER_TEMP/native-fixture.exe" "$RUNNER_TEMP/native-fixture.go"
          cp fixture-driver/.qualification/udp-loopback-witness.go.txt "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/udp-witness.exe" "$RUNNER_TEMP/udp-witness.go"
          if [ '${{ matrix.arch }}' = arm64 ]; then
            go test -tags with_quic ./internal/entities/ssmcache ./core/registry ./database/backup ./service github.com/sagernet/sing-box/service/ssmapi \
              -run 'Test(SSM|OwnedTreeWindows|WindowsSDDL|Cache|OptionalCache)' -count=1 > qualification-evidence/SSM_FOCUSED.txt
          fi
          go version -m candidate-package/solovey-ui-windows/sui.exe > qualification-evidence/GO_BUILD_INFO.txt
      - name: Actual packaged runtime with loopback synthetic state
        shell: bash
        run: |
          node fixture-driver/.qualification/native-package-runtime.mjs \
            --binary candidate-package/solovey-ui-windows/sui.exe \
            --helper "$RUNNER_TEMP/native-fixture.exe" --udp-witness "$RUNNER_TEMP/udp-witness.exe" --output qualification-evidence/RUNTIME.json \
            --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}' --private-api-check true
      - name: Build and exercise native Core profile with its own verified frontend
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -euo pipefail
          test -n "$SUI_RELEASE_TRUST_ROOTS_B64"
          export CGO_ENABLED=1 GOWORK=off GOOS=windows GOARCH='${{ matrix.arch }}'
          if [ '${{ matrix.arch }}' = arm64 ]; then
            export PATH="$(cygpath -u "$MSYS2_LOCATION")/clangarm64/bin:$PATH"
            export CC=clang
          else
            export CC=gcc
          fi
          cd frontend
          npm ci
          SOLOVEY_UI_PROFILE=core npm run build
          cd ..
          node scripts/check-frontend-profile.mjs --profile core --dist frontend/dist
          node scripts/frontend-assets.mjs publish --dist frontend/dist --destination web/html
          mkdir -p candidate-core qualification-evidence/core
          tags=with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_tailscale,minimal
          go build -trimpath -buildvcs=false -tags "$tags" -ldflags="-buildid= -w -s -checklinkname=0 -X github.com/MalenkiySolovey/solovey-ui/config/update.ReleaseTrustRootsBase64=$SUI_RELEASE_TRUST_ROOTS_B64" -o candidate-core/sui.exe main.go
          cp candidate-package/solovey-ui-windows/libcronet.dll candidate-core/libcronet.dll
          {
            printf 'version=v2026.3.3\ncommit=%s\nplatform=windows/${{ matrix.arch }}\nprofile=core\n' "$W5_PRODUCT_COMMIT"
            printf 'source_fingerprint=%s\n' "$(node scripts/release-source.mjs .)"
            node scripts/quic-integration-provenance.mjs build-info
            node scripts/ssm-integration-provenance.mjs build-info
            node scripts/anytls-integration-provenance.mjs build-info
          } > candidate-core/BUILD_INFO.txt
          cp candidate-core/BUILD_INFO.txt qualification-evidence/core/BUILD_INFO.txt
          go version -m candidate-core/sui.exe > qualification-evidence/core/GO_BUILD_INFO.txt
          node fixture-driver/.qualification/native-package-runtime.mjs \
            --binary candidate-core/sui.exe --helper "$RUNNER_TEMP/native-fixture.exe" --udp-witness "$RUNNER_TEMP/udp-witness.exe" \
            --output qualification-evidence/core/RUNTIME.json --commit "$W5_PRODUCT_COMMIT" \
            --fixture-commit '${{ github.sha }}' --private-api-check true
      - name: Retain the independently built Core candidate
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (Test-Path -LiteralPath 'candidate-core/sui.exe') {
            New-Item -ItemType Directory -Path qualification-evidence -Force | Out-Null
            $archive='qualification-evidence/solovey-ui-core-windows-${{ matrix.arch }}.zip'
            Compress-Archive -LiteralPath candidate-core -DestinationPath $archive -CompressionLevel Optimal
            $hash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  solovey-ui-core-windows-${{ matrix.arch }}.zip" | Set-Content -LiteralPath "$archive.sha256"
          }
      - name: Retain sanitized runtime evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w5-windows-${{ matrix.arch }}-runtime
          path: qualification-evidence
          retention-days: 4

  docker-runtime:
    name: Native packaged Docker arm64
    if: inputs.qualify_docker
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Require exact source, native architecture and public trust roots
        env:
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          test "$(uname -m)" = aarch64
          test -n "$SUI_RELEASE_TRUST_ROOTS_B64"
          test "$(go env GOHOSTARCH)" = arm64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Load canonical Dockerfile candidate locally without publication
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: solovey-w5-candidate:arm64
          labels: org.opencontainers.image.revision=${{ env.W5_PRODUCT_COMMIT }}
          build-args: |
            SUI_RELEASE_TRUST_ROOTS_B64=${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64
      - name: Compile fixture and run actual non-root candidate
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          cp fixture-driver/.qualification/native-package-fixture.go.txt "$RUNNER_TEMP/native-fixture.go"
          CGO_ENABLED=1 GOWORK=off go build -tags with_quic -o "$RUNNER_TEMP/native-fixture" "$RUNNER_TEMP/native-fixture.go"
          cp fixture-driver/.qualification/private-api-probe.go.txt "$RUNNER_TEMP/private-api-probe.go"
          CGO_ENABLED=0 GOWORK=off go build -o "$RUNNER_TEMP/private-api-probe" "$RUNNER_TEMP/private-api-probe.go"
          cp fixture-driver/.qualification/udp-loopback-witness.go.txt "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 GOWORK=off go build -o "$RUNNER_TEMP/udp-witness" "$RUNNER_TEMP/udp-witness.go"
          node fixture-driver/.qualification/native-package-runtime.mjs \
            --image solovey-w5-candidate:arm64 --helper "$RUNNER_TEMP/native-fixture" \
            --output qualification-evidence/RUNTIME.json --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}' \
            --private-probe "$RUNNER_TEMP/private-api-probe" --udp-witness "$RUNNER_TEMP/udp-witness" --persist-restart true
      - name: Preserve locally built candidate even when a runtime assertion fails
        if: always()
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          if docker image inspect solovey-w5-candidate:arm64 >/dev/null 2>&1; then
            docker save solovey-w5-candidate:arm64 | gzip -1 > qualification-evidence/docker-arm64-candidate.tar.gz
            sha256sum qualification-evidence/docker-arm64-candidate.tar.gz > qualification-evidence/docker-arm64-candidate.tar.gz.sha256
          fi
      - name: Retain candidate image and sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w5-docker-arm64-runtime
          path: qualification-evidence
          retention-days: 4
  linux-build:
    name: Canonical Linux candidate ${{ matrix.arch }}
    if: inputs.qualify_linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
      - name: Reuse canonical pinned Cronet compiler owner
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/cronet-go"
          git -C "$RUNNER_TEMP/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go" fetch --depth=1 origin 7e27f60f7f04a1c762b6bb69b4a44d7b24cd7a5d
          git -C "$RUNNER_TEMP/cronet-go" checkout FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cronet-go" rev-parse HEAD)" = 7e27f60f7f04a1c762b6bb69b4a44d7b24cd7a5d
          git -C "$RUNNER_TEMP/cronet-go" submodule update --init --recursive --depth=1
          cd "$RUNNER_TEMP/cronet-go"
          rm -f naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            test -z "$line" || printf '%s\n' "$line" >> "$GITHUB_ENV"
          done
      - name: Build full and Core through canonical producers
        env:
          W5_TARGET_ARCH: ${{ matrix.arch }}
          SUI_RELEASE_TRUST_ROOTS_B64: ${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
        run: bash fixture-driver/.qualification/linux-systemd-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: w5-linux-${{ matrix.arch }}-candidates
          path: qualification-evidence
          retention-days: 4

  linux-systemd-runtime:
    name: Native systemd Linux ${{ matrix.arch }}
    if: inputs.qualify_linux
    needs: linux-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.W5_PRODUCT_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: fixture-driver
          sparse-checkout: .qualification
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: frontend/.node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: w5-linux-${{ matrix.arch }}-candidates
          path: candidate-packages
      - name: Require native architecture and actual PID1 systemd
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$W5_PRODUCT_COMMIT"
          test "$(go env GOHOSTARCH)" = '${{ matrix.arch }}'
          test "$(cat /proc/1/comm)" = systemd
          case "$(uname -r)" in *[Mm]icrosoft*) exit 1;; esac
          cat /etc/os-release > candidate-packages/NATIVE_HOST_OS.txt
          uname -a >> candidate-packages/NATIVE_HOST_OS.txt
      - name: Compile independent authenticated clients and private API witness
        run: |
          set -euo pipefail
          cp fixture-driver/.qualification/native-package-fixture.go.txt "$RUNNER_TEMP/native-fixture.go"
          CGO_ENABLED=1 CC=gcc go build -tags with_quic -o "$RUNNER_TEMP/native-fixture" "$RUNNER_TEMP/native-fixture.go"
          cp fixture-driver/.qualification/udp-loopback-witness.go.txt "$RUNNER_TEMP/udp-witness.go"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/udp-witness" "$RUNNER_TEMP/udp-witness.go"
      - name: Run exact full and Core candidates under canonical hardening
        run: |
          set -euo pipefail
          cd candidate-packages
          sha256sum -c "solovey-ui-linux-${{ matrix.arch }}.tar.gz.sha256"
          sha256sum -c "solovey-ui-core-linux-${{ matrix.arch }}.tar.gz.sha256"
          cd ..
          fixture="/run/solovey-w5-${GITHUB_RUN_ID}-${{ matrix.arch }}"
          test ! -e "$fixture"
          sudo -n install -d -m 0755 "$fixture"
          sudo -n install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$fixture/private"
          mkdir -p qualification-evidence
          cp candidate-packages/NATIVE_HOST_OS.txt qualification-evidence/
          for profile in full core; do
            archive="candidate-packages/solovey-ui-linux-${{ matrix.arch }}.tar.gz"
            test "$profile" != core || archive="candidate-packages/solovey-ui-core-linux-${{ matrix.arch }}.tar.gz"
            sudo -n install -d -m 0755 "$fixture/$profile"
            sudo -n tar -xzf "$archive" -C "$fixture/$profile"
            binary=$(find "$fixture/$profile" -type f -name 'solovey-ui' -o -type f -name 'solovey-ui-core')
            test "$(printf '%s\n' "$binary" | wc -l)" = 1
            node fixture-driver/.qualification/native-package-runtime.mjs \
              --binary "$binary" --helper "$RUNNER_TEMP/native-fixture" --udp-witness "$RUNNER_TEMP/udp-witness" \
              --output "qualification-evidence/${profile}-RUNTIME.json" --commit "$W5_PRODUCT_COMMIT" --fixture-commit '${{ github.sha }}' \
              --systemd true --systemd-policy deploy/systemd/solovey-ui-native-hardened.service --fixture-base "$fixture/private" --private-api-check true
          done
          test "$(realpath "$fixture")" = "$fixture"
          test -z "$(find "$fixture/private" -mindepth 1 -maxdepth 1 -type d)"
          sudo -n rm -rf -- "$fixture"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: w5-linux-${{ matrix.arch }}-systemd-runtime
          path: qualification-evidence
          retention-days: 4
