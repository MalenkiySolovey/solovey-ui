          CGO_ENABLED=1 GOWORK=off go build -mod=readonly -o "$RUNNER_TEMP/volume-enroll" "$RUNNER_TEMP/volume-enroll.go"
          go version -m "$RUNNER_TEMP/volume-enroll" > .runtime/qualification-evidence/ENROLL_BUILD_INFO.txt
          sha256sum "$RUNNER_TEMP/volume-enroll" > .runtime/qualification-evidence/ENROLL_SHA256.txt
      - name: Actual old-schema migration and normal owner lifecycle on isolated ARM Docker
        run: |
          set -euo pipefail
          fixture="/run/solovey-w5-docker-arm-${GITHUB_RUN_ID}"
          test ! -e "$fixture"
          sudo -n install -d -m 0700 "$fixture" "$fixture/private"
