name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-tooling:
    name: Build tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Native tooling regressions
        run: node --test scripts/frontend-assets.test.mjs scripts/frontend-test-runner.test.mjs scripts/windows-build.test.mjs scripts/core-provider-build.test.mjs scripts/core-source-provenance.test.mjs scripts/release-providers.test.mjs scripts/release-metadata.test.mjs scripts/audit/source-hygiene.test.mjs scripts/audit/performance.test.mjs
      - name: Verify pinned core copies, pristine authority trees and linear Git series
        if: runner.os == 'Linux'
        run: node scripts/core-source-provenance.mjs verify-remote
      - name: Source format and owned shell entrypoints
        if: runner.os == 'Linux'
        run: node scripts/audit/source-hygiene.mjs
      - name: Windows source format and text contracts
        if: runner.os == 'Windows'
        run: node scripts/audit/source-hygiene.mjs --no-shell

  extended-runtime:
    name: Extended runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=readonly -modfile=go.extended.mod
      EXTENDED_TAGS: shtorm_extended,with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_tailscale
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.extended.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Generate shared full profile imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Validate explicit provider selection
        run: node scripts/core-provider-build.mjs plan --provider shtorm-extended
      - name: Verify native source provenance and reject altered inputs
        run: |
          node scripts/extended-integration-provenance.mjs check
          node --test scripts/extended-integration-provenance.test.mjs
      - name: Compile the complete Panel against the immutable native graph
        shell: bash
        run: go test -run '^$' -tags "$EXTENDED_TAGS" ./...
      - name: Native lifecycle, management and semantic boundary race regressions
        shell: bash
        run: go test -race -count=1 -timeout=10m -tags "$EXTENDED_TAGS" github.com/sagernet/sing-box/adapter ./core/... ./internal/entities/capabilities ./internal/entities/capabilityview ./internal/singbox/apply ./service/coreinboundcontrol ./components/server-protection/service/nativefallback ./service/update ./app ./internal/singbox/validation ./cmd/internal/corecheck ./internal/release ./cmd/solovey-artifact-info
      - name: Native shared configuration and maintenance owner regressions
        shell: bash
        run: go test -race -count=1 -timeout=5m -tags "$EXTENDED_TAGS" -run '^Test(ProviderConfiguration|ProviderDesiredRevision|Maintenance)' ./service
      - name: Native credential owner and strict option race regressions
        shell: bash
        run: go test -race -count=1 -timeout=5m -tags "$EXTENDED_TAGS" ./internal/secrets/... ./internal/auditrecord ./internal/settings/store ./internal/entities/credentials ./internal/entities/clients ./internal/entities/inbounds/... ./internal/entities/protocol ./internal/entities/tls
      - name: Native credential HTTP, candidate rollback and private backup regressions
        shell: bash
        run: go test -race -count=1 -timeout=5m -tags "$EXTENDED_TAGS" -run '^TestNative(Credential|Credentials|Candidate)' ./api ./service
      - name: Native privileged broker race regressions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go_binary=$(command -v go)
          module_cache=$(go env GOMODCACHE)
          sudo env "GOMODCACHE=$module_cache" "GOCACHE=$RUNNER_TEMP/provider-root-go-cache" "CGO_ENABLED=1" "GOFLAGS=$GOFLAGS" \
            "$go_binary" test -race -tags "$EXTENDED_TAGS" -count=1 -timeout=5m ./internal/ops/updatebroker
      - name: Observe real provider and capability build metadata
        shell: bash
        run: go run -tags "$EXTENDED_TAGS" ./tests/core-provider-identity
      - name: Build both shared backend component profiles
        shell: bash
        run: |
          go build -tags "$EXTENDED_TAGS" -o "$RUNNER_TEMP/solovey-extended-full${{ runner.os == 'Windows' && '.exe' || '' }}" main.go
          go build -tags "$EXTENDED_TAGS,minimal" -o "$RUNNER_TEMP/solovey-extended-core${{ runner.os == 'Windows' && '.exe' || '' }}" main.go
      - name: Probe native target validation in both actual binary profiles
        shell: bash
        run: |
          go run -tags "$EXTENDED_TAGS" ./tests/core-target-check "$RUNNER_TEMP/solovey-extended-full${{ runner.os == 'Windows' && '.exe' || '' }}" shtorm-extended
          go run -tags "$EXTENDED_TAGS" ./tests/core-target-check "$RUNNER_TEMP/solovey-extended-core${{ runner.os == 'Windows' && '.exe' || '' }}" shtorm-extended
      - name: Inspect native binaries inside canonical archives without execution
        shell: bash
        run: |
          for profile in full core; do
            SOLOVEY_ARTIFACT_TEST_BINARY="$RUNNER_TEMP/solovey-extended-$profile${{ runner.os == 'Windows' && '.exe' || '' }}" \
              SOLOVEY_ARTIFACT_TEST_PROVIDER=shtorm-extended SOLOVEY_ARTIFACT_TEST_PROFILE="$profile" \
              go test -tags "$EXTENDED_TAGS" -count=1 -timeout=5m -run '^TestArtifactObservationActualBinaryAndArchive$' ./cmd/solovey-artifact-info
          done
      - name: Sign and verify both actual Extended package profiles through the release owner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SOLOVEY_RELEASE_TEST_FULL="$RUNNER_TEMP/solovey-extended-full" \
            SOLOVEY_RELEASE_TEST_CORE="$RUNNER_TEMP/solovey-extended-core" \
            SOLOVEY_RELEASE_TEST_PROVIDER=shtorm-extended \
            node --test scripts/release-provider-artifacts.test.mjs
      - name: Qualify native provider maintenance with root-owned actual candidates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go_binary=$(command -v go)
          module_cache=$(go env GOMODCACHE)
          for profile in full core; do
            sudo env "GOMODCACHE=$module_cache" "GOCACHE=$RUNNER_TEMP/provider-root-go-cache" "CGO_ENABLED=1" "GOFLAGS=$GOFLAGS" \
              "SOLOVEY_PROVIDER_TEST_BINARY=$RUNNER_TEMP/solovey-extended-$profile" \
              SOLOVEY_PROVIDER_TEST_ID=shtorm-extended "SOLOVEY_PROVIDER_TEST_PROFILE=$profile" \
              "$go_binary" test -race -tags "$EXTENDED_TAGS" -count=1 -timeout=5m \
              -run '^Test(ProviderMaintenance|PreparedProviderActual)' ./internal/ops/updatebroker
          done

  docker-native-cronet:
    name: Docker native Cronet (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Build the real image and opt-in native probe without publication
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: native-cronet-probe
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: solovey-native-cronet:${{ matrix.arch }}
          build-args: |
            SUI_RELEASE_TRUST_ROOTS_B64=${{ vars.SUI_RELEASE_TRUST_ROOTS_B64 }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Native engine start, worker drain, shutdown and repeated initialization
        run: |
          set -euo pipefail
          test "$(docker image inspect solovey-native-cronet:${{ matrix.arch }} --format '{{.Architecture}}')" = '${{ matrix.arch }}'
          case '${{ matrix.arch }}' in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
          esac
          timeout 45s docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=65532,gid=65532 \
            solovey-native-cronet:${{ matrix.arch }}

  installer:
    name: Installer
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: frontend/.node-version

      - name: Shell syntax
        run: bash -n install.sh solovey-ui.sh scripts/release-package-linux.sh scripts/release-package-components.sh scripts/server-smoke-debian.sh tests/installer/backup.sh tests/installer/doctor.sh tests/installer/release-manifest.sh tests/installer/release-package.sh tests/installer/install-update.sh tests/installer/migrate-from-sui.sh tests/installer/rollback.sh tests/installer/manager-cookie-key.sh tests/installer/systemd-contracts.sh

      - name: Validate deployment contracts
        env:
          SOLOVEY_UI_IMAGE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SOLOVEY_UI_PANEL_PORT: "2095"
          SOLOVEY_UI_PUBLIC_TCP_PORT: "443"
          SOLOVEY_UI_PUBLIC_UDP_PORT: "443"
        run: |
          bash tests/installer/systemd-contracts.sh
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.bridge.yml config >/dev/null
          docker compose -f deploy/docker/docker-compose.network-advanced.yml config >/dev/null

      - name: release package integration
        run: bash tests/installer/release-package.sh

      - name: Real systemd main-runtime socket sandbox
        run: bash tests/installer/systemd-runtime.sh

      - name: Real systemd cross-UID broker pidfd attestation
        run: bash tests/installer/broker-pidfd-runtime.sh

      - name: Real systemd cross-UID broker request transport
        run: bash tests/installer/broker-request-runtime.sh

      - name: Real native installer recovery from start limit
        run: bash tests/installer/native-activation-recovery.sh

      - name: Real native and Docker Doctor persistence
        run: |
          node scripts/generate-component-imports.mjs --profile full --out app/components_generated.go
          sudo env PATH="$PATH" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)" bash tests/installer/deployment-persistence-runtime.sh
          bash tests/installer/docker-deployment-persistence.sh

      - name: Semantic release resolution and complete release verification
        run: |
          bash tests/installer/latest-release.sh
          bash tests/installer/core-provider.sh
          node --test scripts/release-verify.test.mjs scripts/release-target.test.mjs scripts/release-publish-gate.test.mjs scripts/release-source.test.mjs scripts/release-resume.test.mjs scripts/release-candidate.test.mjs

      - name: signed release manifest integration
        run: bash tests/installer/release-manifest.sh
      - name: privileged broker Linux builds
        run: |
          node scripts/generate-component-imports.mjs --profile full --out app/components_generated.go
          CGO_ENABLED=0 GOOS=linux go build ./cmd/solovey-privileged-broker ./cmd/solovey-ssh-proof ./cmd/solovey-broker-manifest ./components/server-protection/cmd/solovey-owner-manifest

      - name: install/update integration
        run: bash tests/installer/install-update.sh

      - name: Native installer executable ownership
        run: bash tests/installer/native-ownership.sh

      - name: migrate-from-sui integration
        run: bash tests/installer/migrate-from-sui.sh

      - name: rollback integration
        run: bash tests/installer/rollback.sh

      - name: cookie key rotation integration
        run: bash tests/installer/manager-cookie-key.sh

      - name: backup integration
        run: bash tests/installer/backup.sh

      - name: doctor integration
        run: bash tests/installer/doctor.sh

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version

      - name: Generate backend component imports
        run: node scripts/generate-component-imports.mjs --profile full --out app/components_generated.go

      - name: Materialize pinned OpenWrt test references
        run: node scripts/release-openwrt-references.mjs .github/build-inputs/OPENWRT_REFERENCE_LOCK.md --test-references

      - name: Install privileged fixture tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static nftables iproute2

      - name: Owned nft adapter in a disposable network namespace
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/solovey-nftables.test" ./network/nftables
          sudo unshare --net sh -c 'set -eu; ip link set lo up; export SUI_NFT_HOST_TESTS=1; exec "$1" -test.v -test.timeout=2m' sh "$RUNNER_TEMP/solovey-nftables.test"
          rm -f -- "$RUNNER_TEMP/solovey-nftables.test"

      - name: Go vet
        run: go vet ./...

      - name: Go race tests
        run: node scripts/go-test.mjs -race -timeout=10m -- ./...

      - name: Component profile tests
        run: |
          node scripts/go-test.mjs -p 1 -count=1 -- ./internal/components/... ./components/... ./api ./app ./web
          node scripts/go-test.mjs -p 1 -tags minimal -count=1 -- ./internal/components/... ./api ./app ./web

      - name: Minimal dependency boundary
        run: |
          set -euo pipefail
          if go list -tags minimal -deps ./app | grep -E 'github.com/MalenkiySolovey/solovey-ui/(components|api/remotesub|paidsub|api/telegram|service/remote_outbound|internal/subscriptions/remote|cronjob/jobs/notifications)'; then
            echo "minimal app depends on optional backend packages" >&2
            exit 1
          fi

      - name: Core profile build
        run: go build -tags minimal -o /tmp/solovey-ui-core main.go

  quic-integration:
    name: QUIC lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Generate accepted full profile imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Verify pinned QUIC source provenance
        run: node scripts/quic-integration-provenance.mjs check
      - name: Reject altered QUIC source and package provenance
        run: node --test scripts/quic-integration-provenance.test.mjs
      - name: Pinned transport-owner race regressions
        run: go test -race -count=1 -timeout=3m github.com/sagernet/sing-quic github.com/sagernet/sing-quic/tuic
      - name: Authenticated QUIC runtime and Wave 3 identity race regressions
        run: go test -race -p 1 -count=1 -timeout=3m -tags with_quic ./core/runtime ./core/inboundidentity ./core/tracker ./core/registry
      - name: Shared scoped API contracts
        run: go test -race -p 1 -count=1 -timeout=3m -tags with_quic -run TestRuntime ./api
      - name: Observe Official provider and capability build metadata
        shell: bash
        run: go run -mod=readonly -tags with_quic,with_utls ./tests/core-provider-identity
      - name: Probe Official target validation in both actual binary profiles
        shell: bash
        run: |
          tags=with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_tailscale
          go build -mod=readonly -tags "$tags" -o "$RUNNER_TEMP/solovey-official-full${{ runner.os == 'Windows' && '.exe' || '' }}" main.go
          go build -mod=readonly -tags "$tags,minimal" -o "$RUNNER_TEMP/solovey-official-core${{ runner.os == 'Windows' && '.exe' || '' }}" main.go
          go run -mod=readonly -tags "$tags" ./tests/core-target-check "$RUNNER_TEMP/solovey-official-full${{ runner.os == 'Windows' && '.exe' || '' }}" sing-box
          go run -mod=readonly -tags "$tags" ./tests/core-target-check "$RUNNER_TEMP/solovey-official-core${{ runner.os == 'Windows' && '.exe' || '' }}" sing-box
      - name: Inspect Official binaries inside canonical archives without execution
        shell: bash
        run: |
          for profile in full core; do
            SOLOVEY_ARTIFACT_TEST_BINARY="$RUNNER_TEMP/solovey-official-$profile${{ runner.os == 'Windows' && '.exe' || '' }}" \
              SOLOVEY_ARTIFACT_TEST_PROVIDER=sing-box SOLOVEY_ARTIFACT_TEST_PROFILE="$profile" \
              go test -mod=readonly -count=1 -timeout=5m -run '^TestArtifactObservationActualBinaryAndArchive$' ./cmd/solovey-artifact-info
          done
      - name: Sign and verify both actual Official package profiles through the release owner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SOLOVEY_RELEASE_TEST_FULL="$RUNNER_TEMP/solovey-official-full" \
            SOLOVEY_RELEASE_TEST_CORE="$RUNNER_TEMP/solovey-official-core" \
            SOLOVEY_RELEASE_TEST_PROVIDER=sing-box \
            node --test scripts/release-provider-artifacts.test.mjs
      - name: Qualify Official provider maintenance with root-owned actual candidates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go_binary=$(command -v go)
          module_cache=$(go env GOMODCACHE)
          for profile in full core; do
            sudo env "GOMODCACHE=$module_cache" "GOCACHE=$RUNNER_TEMP/provider-root-go-cache" "CGO_ENABLED=1" \
              "SOLOVEY_PROVIDER_TEST_BINARY=$RUNNER_TEMP/solovey-official-$profile" \
              SOLOVEY_PROVIDER_TEST_ID=sing-box "SOLOVEY_PROVIDER_TEST_PROFILE=$profile" \
              "$go_binary" test -race -mod=readonly -tags with_quic,with_utls -count=1 -timeout=5m \
              -run '^Test(ProviderMaintenance|PreparedProviderActual)' ./internal/ops/updatebroker
          done

  ssm-integration:
    name: SSM cache integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Generate accepted full profile imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Verify pinned SSM source and package provenance
        run: node scripts/ssm-integration-provenance.mjs check
      - name: Reject altered SSM source provenance
        run: node --test scripts/ssm-integration-provenance.test.mjs
      - name: Private cache, lifecycle, actual Box and archive race regressions
        run: go test -race -p 1 -count=1 -timeout=3m -tags with_quic -run 'TestCache|TestOptionalCache|TestImmutableRestoreSeed|TestPrivateWindows|TestSSMBox|TestSSMCache|TestOptionalCoreFileOwner' github.com/sagernet/sing-box/service/ssmapi ./internal/entities/ssmcache ./internal/entities/services ./core/registry ./database/backup ./service
      - name: Native Windows short names and actual reparse-point rejection
        if: runner.os == 'Windows'
        run: go test -race -v -count=1 -timeout=2m -run TestOwnedTreeWindows ./database/backup

  anytls-integration:
    name: AnyTLS session integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
      - name: Generate accepted full profile imports
        run: node scripts/generate-component-imports.mjs --profile full
      - name: Verify pinned AnyTLS source and package provenance
        run: node scripts/anytls-integration-provenance.mjs check
      - name: Reject altered AnyTLS source provenance
        run: node --test scripts/anytls-integration-provenance.test.mjs
      - name: Pinned session-owner negotiation and close race regressions
        run: go test -race -count=3 -timeout=2m github.com/anytls/sing-anytls/session
      - name: Official Box outbound metadata and authenticated parent admission
        run: go test -race -p 1 -count=3 -timeout=2m -run TestAnyTLS ./core/runtime ./core/inboundidentity

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend utility script syntax
        run: |
          node --test scripts/audit/architecture-policy.test.mjs
          node scripts/audit/architecture-policy.mjs
          node --check scripts/audit/validate-workflows.js
          node --check scripts/component-frontend-manifest.mjs
          node --check scripts/check-frontend-profile.mjs
          node --check scripts/extract-component-frontend.mjs
          node --check scripts/generate-component-imports.mjs
          node --check scripts/release-manifest.mjs
          node --check scripts/release-preflight.mjs
          node --check scripts/release-preflight.test.mjs
          node --check scripts/write-component-installed-metadata.mjs

      - name: Validate workflow contracts
        run: |
          node --test scripts/release-preflight.test.mjs
          node --test scripts/release-execution.test.mjs scripts/release-resume.test.mjs scripts/release-candidate.test.mjs scripts/release-oci.test.mjs
          node --test scripts/audit/go-shards.test.mjs
          node scripts/audit/validate-workflows.js

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Frontend full build
        working-directory: frontend
        run: SOLOVEY_UI_PROFILE=full npm run build

      - name: Frontend full profile scan
        run: node scripts/check-frontend-profile.mjs --profile full --dist frontend/dist

      - name: Verify frontend production assets
        run: node scripts/frontend-assets.mjs verify --dist frontend/dist

      - name: Frontend component pack extraction scan
        run: node scripts/extract-component-frontend.mjs --dist frontend/dist --components-dir components --out-dir .release/components --prune-dist

      - name: Frontend core build
        working-directory: frontend
        run: SOLOVEY_UI_PROFILE=core npm run build

      - name: Frontend core profile scan
        run: node scripts/check-frontend-profile.mjs --profile core --dist frontend/dist
